<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Mapel — Tembok Belajar</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Style tambahan khusus halaman ini */
    .page-container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    
    .page-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .page-toolbar h1 { font-size: 1.6rem; color: var(--tb-dark); font-weight: 700; }
    .page-toolbar h1 small { display: block; font-size: 0.8rem; font-weight: 400; color: var(--tb-text-muted); margin-top: 4px; }
    
    .toolbar-actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    
    .search-input {
      padding: 0.6rem 1rem; border: 1px solid var(--tb-border);
      border-radius: 30px; font-size: 0.85rem; outline: none;
      min-width: 220px; font-family: inherit;
    }
    .search-input:focus { border-color: var(--tb-primary); box-shadow: 0 0 0 3px rgba(46,204,113,0.15); }
    
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.8rem; }
    
    /* Tabel */
    .table-card {
      background: white; border-radius: var(--tb-radius-lg);
      border: 1px solid rgba(46,204,113,0.1); overflow: hidden;
      box-shadow: var(--tb-shadow-sm);
    }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .data-table thead { background: var(--tb-light); }
    .data-table th {
      padding: 0.9rem 1rem; text-align: left; font-weight: 600;
      color: var(--tb-dark); border-bottom: 2px solid var(--tb-primary);
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .data-table td { padding: 0.8rem 1rem; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    .data-table tr:hover { background: #f8f9fa; }
    .data-table tr:last-child td { border-bottom: none; }
    
    .kode-badge {
      display: inline-block; background: var(--tb-light); color: var(--tb-dark);
      padding: 3px 10px; border-radius: 8px; font-weight: 700; font-size: 0.75rem;
      font-family: monospace;
    }
    .nama-mapel { font-weight: 600; color: var(--tb-text); }
    
    .action-btns { display: flex; gap: 6px; }
    .btn-icon {
      background: transparent; border: 1px solid var(--tb-border);
      width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: var(--tb-transition); font-size: 0.9rem;
    }
    .btn-icon:hover { background: var(--tb-light); border-color: var(--tb-primary); }
    .btn-icon.danger:hover { background: #fadbd8; border-color: var(--tb-danger); }
    
    /* Empty state */
    .empty-row { text-align: center; padding: 3rem 1rem; color: var(--tb-text-muted); }
    .empty-row .emoji { font-size: 3rem; display: block; margin-bottom: 0.8rem; opacity: 0.5; }
    
    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: white; border-radius: var(--tb-radius-lg);
      padding: 2rem; width: 100%; max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: tbFadeInUp 0.3s ease;
    }
    .modal-card h2 { font-size: 1.3rem; color: var(--tb-dark); margin-bottom: 1.2rem; font-weight: 700; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem; }
    
    .btn-secondary {
      background: #6c757d; color: white; border: none;
      padding: 0.6rem 1.2rem; border-radius: 30px; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; transition: var(--tb-transition);
    }
    .btn-secondary:hover { background: #5a6268; }
    
    .btn-danger {
      background: var(--tb-danger); color: white; border: none;
      padding: 0.6rem 1.2rem; border-radius: 30px; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; transition: var(--tb-transition);
    }
    .btn-danger:hover { background: #c0392b; }
    
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--tb-dark); color: white;
      padding: 1rem 1.4rem; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      font-size: 0.85rem; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transform: translateY(20px);
      transition: all 0.3s ease; z-index: 3000;
      max-width: 320px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--tb-danger); }
    
    .info-bar {
      background: var(--tb-light); border-radius: 12px;
      padding: 0.7rem 1rem; margin-bottom: 1rem;
      font-size: 0.8rem; color: var(--tb-dark); font-weight: 500;
      display: flex; align-items: center; gap: 8px;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-brand">🧱 Tembok Belajar — Operator</div>
    <div class="app-user">
      <span id="userName">Memuat...</span>
      <div class="avatar" id="userAvatar">?</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <div id="loading" class="loading-box">
    <div class="spinner"></div>
    <p>Memuat data mapel...</p>
  </div>

  <div class="page-container hidden" id="pageContent">
    
    <div class="page-toolbar">
      <div>
        <h1>📚 Manajemen Mapel
          <small>Kelola daftar mata pelajaran di sekolah Anda</small>
        </h1>
      </div>
      <div class="toolbar-actions">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari mapel..." oninput="renderTable()">
        <button class="btn-primary btn-sm" onclick="openModal()">+ Tambah Mapel</button>
      </div>
    </div>

    <div class="info-bar">
      <span>ℹ️</span>
      <span>Total: <strong id="totalCount">0</strong> mapel · 
            Menampilkan: <strong id="shownCount">0</strong></span>
    </div>

    <div class="table-card">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:50px;">No</th>
            <th style="width:120px;">Kode</th>
            <th>Nama Mapel</th>
            <th style="width:120px;">Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="4" class="empty-row">Memuat...</td></tr>
        </tbody>
      </table>
    </div>

    <div style="margin-top: 1rem; text-align:center;">
      <a href="dashboard.html" class="btn-secondary" style="text-decoration:none; display:inline-block;">
        ← Kembali ke Dashboard
      </a>
    </div>

  </div>

  <!-- Modal Form -->
  <div class="modal-overlay" id="modalForm">
    <div class="modal-card">
      <h2 id="modalTitle">Tambah Mapel</h2>
      
      <label class="form-label" for="inputCode">Kode Mapel</label>
      <input type="text" id="inputCode" class="form-input" placeholder="Contoh: MAT, FIS, BIN" maxlength="10" style="text-transform:uppercase;">
      
      <label class="form-label" for="inputName">Nama Mapel</label>
      <input type="text" id="inputName" class="form-input" placeholder="Contoh: Matematika Wajib">
      
      <div id="modalError" class="alert alert-error hidden" style="margin-top:0;"></div>
      
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Batal</button>
        <button class="btn-primary" id="btnSave" onclick="saveSubject()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Modal Konfirmasi Hapus -->
  <div class="modal-overlay" id="modalDelete">
    <div class="modal-card">
      <h2>🗑️ Hapus Mapel?</h2>
      <p id="deleteMessage" style="color: var(--tb-text); margin-bottom: 1rem;">
        Anda yakin ingin menghapus mapel ini?
      </p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteModal()">Batal</button>
        <button class="btn-danger" id="btnConfirmDelete" onclick="confirmDelete()">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    /* ============================================================
       STATE
       ============================================================ */
    let allSubjects = [];
    let editingId = null;
    let deletingId = null;
    let currentUser = null;
    let currentSchoolId = 1;

    /* ============================================================
       INIT
       ============================================================ */
    (async () => {
      initSupabase();
      currentUser = await requireAuth('operator');
      if (!currentUser) return;

      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
      currentSchoolId = currentUser.school_id || 1;

      await loadSubjects();
    })();

    /* ============================================================
       LOAD DATA
       ============================================================ */
    async function loadSubjects() {
      try {
        allSubjects = await getSubjects(currentSchoolId);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('pageContent').classList.remove('hidden');
        renderTable();
      } catch (err) {
        console.error('Gagal load mapel:', err);
        document.getElementById('loading').innerHTML =
          '<p style="color:var(--tb-danger);">Gagal memuat mapel: ' + err.message + '</p>';
      }
    }

    /* ============================================================
       RENDER TABEL
       ============================================================ */
    function renderTable() {
      const keyword = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const filtered = allSubjects.filter(s =>
        (s.name || '').toLowerCase().includes(keyword) ||
        (s.code || '').toLowerCase().includes(keyword)
      );

      document.getElementById('totalCount').textContent = allSubjects.length;
      document.getElementById('shownCount').textContent = filtered.length;

      const tbody = document.getElementById('tableBody');

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="4" class="empty-row">
            <span class="emoji">📚</span>
            ${allSubjects.length === 0 
              ? 'Belum ada mapel. Klik "+ Tambah Mapel" untuk memulai.' 
              : 'Tidak ada mapel yang cocok dengan pencarian.'}
          </td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((s, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><span class="kode-badge">${escapeHtml(s.code || '-')}</span></td>
          <td class="nama-mapel">${escapeHtml(s.name)}</td>
          <td>
            <div class="action-btns">
              <button class="btn-icon" title="Edit" onclick="openModal(${s.id})">✏️</button>
              <button class="btn-icon danger" title="Hapus" onclick="openDelete(${s.id})">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    /* ============================================================
       MODAL FORM
       ============================================================ */
    function openModal(id = null) {
      editingId = id;
      const modal = document.getElementById('modalForm');
      const title = document.getElementById('modalTitle');
      const inputCode = document.getElementById('inputCode');
      const inputName = document.getElementById('inputName');
      const errBox = document.getElementById('modalError');
      const btnSave = document.getElementById('btnSave');

      errBox.classList.add('hidden');
      btnSave.disabled = false;
      btnSave.textContent = 'Simpan';

      if (id) {
        const subject = allSubjects.find(s => s.id === id);
        if (!subject) return;
        title.textContent = 'Edit Mapel';
        inputCode.value = subject.code || '';
        inputName.value = subject.name || '';
      } else {
        title.textContent = 'Tambah Mapel';
        inputCode.value = '';
        inputName.value = '';
      }

      modal.classList.add('active');
      setTimeout(() => inputCode.focus(), 100);
    }

    function closeModal() {
      document.getElementById('modalForm').classList.remove('active');
      editingId = null;
    }

    async function saveSubject() {
      const code = document.getElementById('inputCode').value.trim().toUpperCase();
      const name = document.getElementById('inputName').value.trim();
      const errBox = document.getElementById('modalError');
      const btnSave = document.getElementById('btnSave');

      if (!code) {
        errBox.textContent = 'Kode mapel wajib diisi.';
        errBox.classList.remove('hidden');
        return;
      }
      if (!name) {
        errBox.textContent = 'Nama mapel wajib diisi.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      btnSave.disabled = true;
      btnSave.textContent = 'Menyimpan...';

      try {
        if (editingId) {
          await updateSubject(editingId, { name, code });
          showToast('✅ Mapel berhasil diperbarui');
        } else {
          await createSubject({ name, code, schoolId: currentSchoolId });
          showToast('✅ Mapel berhasil ditambahkan');
        }
        closeModal();
        await loadSubjects();
      } catch (err) {
        console.error('Save error:', err);
        errBox.textContent = 'Gagal menyimpan: ' + err.message;
        errBox.classList.remove('hidden');
        btnSave.disabled = false;
        btnSave.textContent = 'Simpan';
      }
    }

    /* ============================================================
       HAPUS MAPEL
       ============================================================ */
    function openDelete(id) {
      deletingId = id;
      const subject = allSubjects.find(s => s.id === id);
      if (!subject) return;

      document.getElementById('deleteMessage').innerHTML =
        'Anda yakin ingin menghapus mapel <strong>' + escapeHtml(subject.name) + '</strong>? ' +
        'Tindakan ini tidak dapat dibatalkan.';

      document.getElementById('modalDelete').classList.add('active');
    }

    function closeDeleteModal() {
      document.getElementById('modalDelete').classList.remove('active');
      deletingId = null;
    }

    async function confirmDelete() {
      if (!deletingId) return;
      const btn = document.getElementById('btnConfirmDelete');
      btn.disabled = true;
      btn.textContent = 'Menghapus...';

      try {
        const check = await isSubjectUsed(deletingId);
        if (check.used) {
          closeDeleteModal();
          showToast('⚠️ Mapel sedang dipakai (' + check.by + '), tidak bisa dihapus.', 'error');
          btn.disabled = false;
          btn.textContent = 'Ya, Hapus';
          return;
        }
        await deleteSubject(deletingId);
        closeDeleteModal();
        showToast('🗑️ Mapel berhasil dihapus');
        await loadSubjects();
      } catch (err) {
        console.error('Delete error:', err);
        showToast('Gagal menghapus: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ya, Hapus';
      }
    }

    /* ============================================================
       UTILS
       ============================================================ */
    function escapeHtml(t) {
      if (t === null || t === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(t);
      return d.innerHTML;
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type === 'error' ? 'error' : '');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    /* Enter untuk submit di modal */
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('modalForm').classList.contains('active')) {
        saveSubject();
      }
      if (e.key === 'Escape') {
        closeModal();
        closeDeleteModal();
      }
    });
  </script>
</body>
</html>
