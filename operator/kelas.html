<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Kelas — Tembok Belajar</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .page-container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    .page-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .page-toolbar h1 { font-size: 1.6rem; color: var(--tb-dark); font-weight: 700; }
    .page-toolbar h1 small { display: block; font-size: 0.8rem; font-weight: 400; color: var(--tb-text-muted); margin-top: 4px; }

    .toolbar-actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }

    .search-input {
      padding: 0.6rem 1rem; border: 1px solid var(--tb-border);
      border-radius: 30px; font-size: 0.85rem; outline: none;
      min-width: 220px; font-family: inherit;
    }
    .search-input:focus { border-color: var(--tb-primary); box-shadow: 0 0 0 3px rgba(46,204,113,0.15); }

    .btn-sm { padding: 0.5rem 1rem; font-size: 0.8rem; }

    .table-card {
      background: white; border-radius: var(--tb-radius-lg);
      border: 1px solid rgba(46,204,113,0.1); overflow: hidden;
      box-shadow: var(--tb-shadow-sm);
    }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .data-table thead { background: var(--tb-light); }
    .data-table th {
      padding: 0.9rem 1rem; text-align: left; font-weight: 600;
      color: var(--tb-dark); border-bottom: 2px solid var(--tb-primary);
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .data-table td { padding: 0.8rem 1rem; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    .data-table tr:hover { background: #f8f9fa; }
    .data-table tr:last-child td { border-bottom: none; }

    .grade-badge {
      display: inline-block; background: var(--tb-primary); color: white;
      padding: 3px 12px; border-radius: 20px; font-weight: 700; font-size: 0.75rem;
    }
    .nama-kelas { font-weight: 600; color: var(--tb-text); }
    .ruang-teks { color: var(--tb-text-muted); font-size: 0.8rem; }

    .action-btns { display: flex; gap: 6px; }
    .btn-icon {
      background: transparent; border: 1px solid var(--tb-border);
      width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: var(--tb-transition); font-size: 0.9rem;
    }
    .btn-icon:hover { background: var(--tb-light); border-color: var(--tb-primary); }
    .btn-icon.danger:hover { background: #fadbd8; border-color: var(--tb-danger); }

    .empty-row { text-align: center; padding: 3rem 1rem; color: var(--tb-text-muted); }
    .empty-row .emoji { font-size: 3rem; display: block; margin-bottom: 0.8rem; opacity: 0.5; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: white; border-radius: var(--tb-radius-lg);
      padding: 2rem; width: 100%; max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: tbFadeInUp 0.3s ease;
    }
    .modal-card h2 { font-size: 1.3rem; color: var(--tb-dark); margin-bottom: 1.2rem; font-weight: 700; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem; }

    .btn-secondary {
      background: #6c757d; color: white; border: none;
      padding: 0.6rem 1.2rem; border-radius: 30px; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; transition: var(--tb-transition);
    }
    .btn-secondary:hover { background: #5a6268; }

    .btn-danger {
      background: var(--tb-danger); color: white; border: none;
      padding: 0.6rem 1.2rem; border-radius: 30px; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; transition: var(--tb-transition);
    }
    .btn-danger:hover { background: #c0392b; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--tb-dark); color: white;
      padding: 1rem 1.4rem; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      font-size: 0.85rem; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transform: translateY(20px);
      transition: all 0.3s ease; z-index: 3000;
      max-width: 340px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--tb-danger); }

    .info-bar {
      background: var(--tb-light); border-radius: 12px;
      padding: 0.7rem 1rem; margin-bottom: 1rem;
      font-size: 0.8rem; color: var(--tb-dark); font-weight: 500;
      display: flex; align-items: center; gap: 8px;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-brand">🧱 Tembok Belajar — Operator</div>
    <div class="app-user">
      <span id="userName">Memuat...</span>
      <div class="avatar" id="userAvatar">?</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <div id="loading" class="loading-box">
    <div class="spinner"></div>
    <p>Memuat data kelas...</p>
  </div>

  <div class="page-container hidden" id="pageContent">

    <div class="page-toolbar">
      <div>
        <h1>🏫 Manajemen Kelas
          <small>Kelola daftar kelas di sekolah Anda</small>
        </h1>
      </div>
      <div class="toolbar-actions">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari kelas..." oninput="renderTable()">
        <button class="btn-primary btn-sm" onclick="openModal()">+ Tambah Kelas</button>
      </div>
    </div>

    <div class="info-bar">
      <span>ℹ️</span>
      <span>Total: <strong id="totalCount">0</strong> kelas ·
            Menampilkan: <strong id="shownCount">0</strong></span>
    </div>

    <div class="table-card">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:50px;">No</th>
            <th style="width:100px;">Tingkat</th>
            <th>Nama Kelas</th>
            <th style="width:180px;">Ruang</th>
            <th style="width:120px;">Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5" class="empty-row">Memuat...</td></tr>
        </tbody>
      </table>
    </div>

    <div style="margin-top: 1rem; text-align:center;">
      <a href="dashboard.html" class="btn-secondary" style="text-decoration:none; display:inline-block;">
        ← Kembali ke Dashboard
      </a>
    </div>

  </div>

  <!-- Modal Form -->
  <div class="modal-overlay" id="modalForm">
    <div class="modal-card">
      <h2 id="modalTitle">Tambah Kelas</h2>

      <label class="form-label" for="inputName">Nama Kelas <span style="color:var(--tb-danger);">*</span></label>
      <input type="text" id="inputName" class="form-input" placeholder="Contoh: X IPA 1" maxlength="50">

      <label class="form-label" for="inputGrade">Tingkat</label>
      <input type="text" id="inputGrade" class="form-input" placeholder="Contoh: X, XI, XII, 10, 11" maxlength="10">

      <label class="form-label" for="inputRoom">Ruang <span style="color:var(--tb-text-muted); font-weight:400;">(opsional)</span></label>
      <input type="text" id="inputRoom" class="form-input" placeholder="Contoh: Ruang 201" maxlength="50">

      <div id="modalError" class="alert alert-error hidden" style="margin-top:0;"></div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Batal</button>
        <button class="btn-primary" id="btnSave" onclick="saveClass()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Modal Konfirmasi Hapus -->
  <div class="modal-overlay" id="modalDelete">
    <div class="modal-card">
      <h2>🗑️ Hapus Kelas?</h2>
      <p id="deleteMessage" style="color: var(--tb-text); margin-bottom: 1rem;">
        Anda yakin ingin menghapus kelas ini?
      </p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteModal()">Batal</button>
        <button class="btn-danger" id="btnConfirmDelete" onclick="confirmDelete()">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    /* ============================================================
       STATE
       ============================================================ */
    let allClasses = [];
    let editingId = null;
    let deletingId = null;
    let currentUser = null;
    let currentSchoolId = 1;

    /* ============================================================
       INIT
       ============================================================ */
    (async () => {
      initSupabase();
      currentUser = await requireAuth('operator');
      if (!currentUser) return;

      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
      currentSchoolId = currentUser.school_id || 1;

      await loadClasses();
    })();

    /* ============================================================
       LOAD DATA
       ============================================================ */
    async function loadClasses() {
      try {
        allClasses = await getClasses(currentSchoolId);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('pageContent').classList.remove('hidden');
        renderTable();
      } catch (err) {
        console.error('Gagal load kelas:', err);
        document.getElementById('loading').innerHTML =
          '<p style="color:var(--tb-danger);">Gagal memuat kelas: ' + err.message + '</p>';
      }
    }

    /* ============================================================
       RENDER TABEL
       ============================================================ */
    function renderTable() {
      const keyword = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const filtered = allClasses.filter(c =>
        (c.name || '').toLowerCase().includes(keyword) ||
        (c.grade || '').toLowerCase().includes(keyword) ||
        (c.room || '').toLowerCase().includes(keyword)
      );

      document.getElementById('totalCount').textContent = allClasses.length;
      document.getElementById('shownCount').textContent = filtered.length;

      const tbody = document.getElementById('tableBody');

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="5" class="empty-row">
            <span class="emoji">🏫</span>
            ${allClasses.length === 0
              ? 'Belum ada kelas. Klik "+ Tambah Kelas" untuk memulai.'
              : 'Tidak ada kelas yang cocok dengan pencarian.'}
          </td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((c, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${c.grade ? `<span class="grade-badge">${escapeHtml(c.grade)}</span>` : '-'}</td>
          <td class="nama-kelas">${escapeHtml(c.name)}</td>
          <td class="ruang-teks">${escapeHtml(c.room || '-')}</td>
          <td>
            <div class="action-btns">
              <button class="btn-icon" title="Edit" onclick="openModal(${c.id})">✏️</button>
              <button class="btn-icon danger" title="Hapus" onclick="openDelete(${c.id})">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    /* ============================================================
       MODAL FORM
       ============================================================ */
    function openModal(id = null) {
      editingId = id;
      const modal = document.getElementById('modalForm');
      const title = document.getElementById('modalTitle');
      const inputName = document.getElementById('inputName');
      const inputGrade = document.getElementById('inputGrade');
      const inputRoom = document.getElementById('inputRoom');
      const errBox = document.getElementById('modalError');
      const btnSave = document.getElementById('btnSave');

      errBox.classList.add('hidden');
      btnSave.disabled = false;
      btnSave.textContent = 'Simpan';

      if (id) {
        const cls = allClasses.find(c => c.id === id);
        if (!cls) return;
        title.textContent = 'Edit Kelas';
        inputName.value = cls.name || '';
        inputGrade.value = cls.grade || '';
        inputRoom.value = cls.room || '';
      } else {
        title.textContent = 'Tambah Kelas';
        inputName.value = '';
        inputGrade.value = '';
        inputRoom.value = '';
      }

      modal.classList.add('active');
      setTimeout(() => inputName.focus(), 100);
    }

    function closeModal() {
      document.getElementById('modalForm').classList.remove('active');
      editingId = null;
    }

    async function saveClass() {
      const name = document.getElementById('inputName').value.trim();
      const grade = document.getElementById('inputGrade').value.trim();
      const room = document.getElementById('inputRoom').value.trim();
      const errBox = document.getElementById('modalError');
      const btnSave = document.getElementById('btnSave');

      if (!name) {
        errBox.textContent = 'Nama kelas wajib diisi.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      btnSave.disabled = true;
      btnSave.textContent = 'Menyimpan...';

      try {
        if (editingId) {
          await updateClass(editingId, { name, grade, room });
          showToast('✅ Kelas berhasil diperbarui');
        } else {
          await createClass({ name, grade, room, schoolId: currentSchoolId });
          showToast('✅ Kelas berhasil ditambahkan');
        }
        closeModal();
        await loadClasses();
      } catch (err) {
        console.error('Save error:', err);
        errBox.textContent = 'Gagal menyimpan: ' + err.message;
        errBox.classList.remove('hidden');
        btnSave.disabled = false;
        btnSave.textContent = 'Simpan';
      }
    }

    /* ============================================================
       HAPUS KELAS
       ============================================================ */
    function openDelete(id) {
      deletingId = id;
      const cls = allClasses.find(c => c.id === id);
      if (!cls) return;

      document.getElementById('deleteMessage').innerHTML =
        'Anda yakin ingin menghapus kelas <strong>' + escapeHtml(cls.name) + '</strong>? ' +
        'Tindakan ini tidak dapat dibatalkan.';

      document.getElementById('modalDelete').classList.add('active');
    }

    function closeDeleteModal() {
      document.getElementById('modalDelete').classList.remove('active');
      deletingId = null;
    }

    async function confirmDelete() {
      if (!deletingId) return;
      const btn = document.getElementById('btnConfirmDelete');
      btn.disabled = true;
      btn.textContent = 'Menghapus...';

      try {
        const check = await isClassUsed(deletingId);
        if (check.used) {
          closeDeleteModal();
          showToast('⚠️ Kelas sedang dipakai (' + check.by + '), tidak bisa dihapus.', 'error');
          btn.disabled = false;
          btn.textContent = 'Ya, Hapus';
          return;
        }
        await deleteClass(deletingId);
        closeDeleteModal();
        showToast('🗑️ Kelas berhasil dihapus');
        await loadClasses();
      } catch (err) {
        console.error('Delete error:', err);
        showToast('Gagal menghapus: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ya, Hapus';
      }
    }

    /* ============================================================
       UTILS
       ============================================================ */
    function escapeHtml(t) {
      if (t === null || t === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(t);
      return d.innerHTML;
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type === 'error' ? 'error' : '');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('modalForm').classList.contains('active')) {
        saveClass();
      }
      if (e.key === 'Escape') {
        closeModal();
        closeDeleteModal();
      }
    });
  </script>
</body>
</html>
