<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivitas & Tugas — Tembok Belajar</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .page-container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .page-toolbar h1 { font-size: 1.6rem; color: var(--tb-dark); font-weight: 700; }
    .page-toolbar h1 small { display: block; font-size: 0.8rem; font-weight: 400; color: var(--tb-text-muted); margin-top: 4px; }

    .context-bar {
      background: var(--tb-light); border-radius: 12px;
      padding: 0.8rem 1.2rem; margin-bottom: 1.2rem;
      display: flex; gap: 1.5rem; flex-wrap: wrap; font-size: 0.85rem;
    }
    .context-bar strong { color: var(--tb-dark); }

    .panel {
      background: white; border-radius: var(--tb-radius-lg);
      border: 1px solid rgba(46,204,113,0.1);
      padding: 1.5rem; box-shadow: var(--tb-shadow-sm);
    }
    .panel-title {
      font-size: 1rem; font-weight: 700; color: var(--tb-dark);
      margin-bottom: 1rem; padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--tb-light);
    }

    .activity-list { display: flex; flex-direction: column; gap: 0.8rem; }
    .activity-item {
      background: var(--tb-bg); border-radius: 12px;
      padding: 1rem 1.2rem;
      border-left: 4px solid var(--tb-primary);
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; flex-wrap: wrap;
    }
    .activity-info { flex: 1; min-width: 200px; }
    .activity-info .title { font-weight: 700; color: var(--tb-dark); font-size: 0.95rem; margin-bottom: 0.3rem; }
    .activity-info .desc { font-size: 0.8rem; color: var(--tb-text-muted); margin-bottom: 0.3rem; }
    .activity-info .meta { font-size: 0.75rem; color: var(--tb-text-muted); display: flex; gap: 1rem; flex-wrap: wrap; }
    .activity-info .meta span { display: flex; align-items: center; gap: 4px; }
    .activity-info .meta .badge-type {
      background: var(--tb-light); color: var(--tb-dark);
      padding: 1px 8px; border-radius: 8px; font-weight: 600;
      font-size: 0.7rem;
    }
    .activity-actions { display: flex; gap: 6px; }
    .btn-icon {
      background: white; border: 1px solid var(--tb-border);
      padding: 5px 10px; border-radius: 8px; cursor: pointer;
      font-size: 0.8rem; transition: var(--tb-transition);
      text-decoration: none; color: var(--tb-text);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-icon:hover { background: var(--tb-light); border-color: var(--tb-primary); }
    .btn-icon.danger:hover { background: #fadbd8; border-color: var(--tb-danger); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: 1rem; overflow-y: auto;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: white; border-radius: var(--tb-radius-lg);
      padding: 2rem; width: 100%; max-width: 520px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      margin: auto;
    }
    .modal-card h2 { font-size: 1.2rem; color: var(--tb-dark); margin-bottom: 1rem; font-weight: 700; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem; }

    .btn-primary {
      background: linear-gradient(135deg, var(--tb-primary), var(--tb-secondary));
      color: white; border: none; padding: 0.6rem 1.4rem;
      border-radius: 30px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
      transition: var(--tb-transition);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(46,204,113,0.3); }
    .btn-secondary {
      background: #6c757d; color: white; border: none;
      padding: 0.6rem 1.4rem; border-radius: 30px; cursor: pointer;
      font-size: 0.85rem; font-weight: 600;
    }

    .form-label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--tb-dark); }
    .form-input {
      width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--tb-border);
      border-radius: 10px; font-size: 0.9rem; font-family: inherit;
      margin-bottom: 1rem; outline: none;
    }
    .form-input:focus { border-color: var(--tb-primary); box-shadow: 0 0 0 3px rgba(46,204,113,0.15); }
    textarea.form-input { resize: vertical; min-height: 80px; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--tb-dark); color: white;
      padding: 1rem 1.4rem; border-radius: 12px;
      font-size: 0.85rem; font-weight: 500;
      opacity: 0; transform: translateY(20px);
      transition: all 0.3s ease; z-index: 3000;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--tb-danger); }

    .empty-msg { text-align: center; color: var(--tb-text-muted); padding: 2rem; font-size: 0.85rem; }
    .back-nav { text-align: center; margin-top: 2rem; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      background: white; color: var(--tb-dark);
      padding: 0.6rem 1.5rem; border-radius: 30px;
      text-decoration: none; font-weight: 600; border: 1px solid var(--tb-light);
      font-size: 0.85rem;
    }
    .btn-back:hover { background: var(--tb-light); }

    @media (max-width: 600px) { .page-container { padding: 1.2rem 1rem; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-brand">🧱 Tembok Belajar — Guru</div>
    <div class="app-user">
      <span id="userName">Memuat...</span>
      <div class="avatar" id="userAvatar">?</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <div id="loading" class="loading-box"><div class="spinner"></div><p>Memuat aktivitas...</p></div>

  <div class="page-container hidden" id="pageContent">
    <div class="page-toolbar">
      <h1>✏️ Aktivitas & Tugas
        <small>Buat tugas atau kuis untuk siswa</small>
      </h1>
      <button class="btn-primary" onclick="openModal()">+ Aktivitas Baru</button>
    </div>

    <div class="context-bar" id="contextBar" style="display:none;">
      <span>📚 Mapel: <strong id="ctxSubject">-</strong></span>
      <span>🏫 Kelas: <strong id="ctxClass">-</strong></span>
    </div>

    <div class="panel">
      <h2 class="panel-title">📋 Daftar Aktivitas</h2>
      <div class="activity-list" id="activityList">
        <div class="empty-msg">Memuat...</div>
      </div>
    </div>

    <div class="back-nav">
      <a href="dashboard.html" class="btn-back">← Kembali ke Dashboard</a>
    </div>
  </div>

  <div class="modal-overlay" id="modalForm">
    <div class="modal-card">
      <h2 id="modalTitle">Aktivitas Baru</h2>

      <label class="form-label">Tipe</label>
      <select id="inputType" class="form-input">
        <option value="task">Tugas (Task)</option>
        <option value="quiz">Kuis (Quiz)</option>
      </select>

      <label class="form-label">Judul</label>
      <input type="text" id="inputTitle" class="form-input" placeholder="Contoh: Latihan Soal Bab 3" maxlength="150">

      <label class="form-label">Deskripsi / Instruksi</label>
      <textarea id="inputDesc" class="form-input" placeholder="Jelaskan tugas..."></textarea>

      <label class="form-label">Deadline</label>
      <input type="datetime-local" id="inputDeadline" class="form-input">

      <label class="form-label">Nilai Maksimal</label>
      <input type="number" id="inputMaxScore" class="form-input" value="100" min="1" max="1000">

      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Batal</button>
        <button class="btn-primary" id="btnSave" onclick="saveActivity()">Simpan</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    let currentUser = null;
    let currentContext = null;
    let allActivities = [];

    (async () => {
      initSupabase();
      currentUser = await requireAuth('guru');
      if (!currentUser) return;
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();

      const ctx = sessionStorage.getItem('guru_context');
      if (ctx) {
        currentContext = JSON.parse(ctx);
        document.getElementById('ctxSubject').textContent = currentContext.subjectName;
        try {
          const classes = await getClasses(currentUser.school_id);
          const cls = classes.find(c => c.id === currentContext.classId);
          if (cls) document.getElementById('ctxClass').textContent = cls.name;
        } catch (e) {}
        await loadActivities();
      }

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('pageContent').classList.remove('hidden');
    })();

    async function loadActivities() {
      if (!currentContext) return;
      try {
        allActivities = await getActivities(currentContext.classId, currentContext.subjectId);
        renderList();
      } catch (err) {
        document.getElementById('activityList').innerHTML = '<div class="empty-msg" style="color:red;">Error: ' + err.message + '</div>';
      }
    }

    function renderList() {
      const c = document.getElementById('activityList');
      if (allActivities.length === 0) {
        c.innerHTML = '<div class="empty-msg">Belum ada aktivitas. Klik "+ Aktivitas Baru"</div>';
        return;
      }
      c.innerHTML = allActivities.map(a => `
        <div class="activity-item">
          <div class="activity-info">
            <div class="title">${esc(a.title)}</div>
            <div class="desc">${esc((a.description || '').substring(0, 100))}${(a.description || '').length > 100 ? '...' : ''}</div>
            <div class="meta">
              <span class="badge-type">${a.type === 'quiz' ? '🧪 Kuis' : '📝 Tugas'}</span>
              <span>⏰ ${a.deadline ? new Date(a.deadline).toLocaleString('id-ID') : '-'}</span>
              <span>💯 Max: ${a.max_score}</span>
            </div>
          </div>
          <div class="activity-actions">
            <a href="penilaian.html" class="btn-icon" onclick="setCtxActivity(${a.id})">📝 Nilai</a>
            <button class="btn-icon danger" onclick="deleteConfirm(${a.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function setCtxActivity(activityId) {
      if (currentContext) {
        currentContext.activityId = activityId;
        sessionStorage.setItem('guru_context', JSON.stringify(currentContext));
      }
    }

    function openModal() {
      if (!currentContext) { alert('Pilih kelas dulu dari halaman Mapel Saya → kelas → Aktivitas'); return; }
      document.getElementById('modalTitle').textContent = 'Aktivitas Baru';
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputDesc').value = '';
      document.getElementById('inputDeadline').value = '';
      document.getElementById('inputMaxScore').value = '100';
      document.getElementById('inputType').value = 'task';
      document.getElementById('modalForm').classList.add('active');
    }

    function closeModal() { document.getElementById('modalForm').classList.remove('active'); }

    async function saveActivity() {
      const type = document.getElementById('inputType').value;
      const title = document.getElementById('inputTitle').value.trim();
      const description = document.getElementById('inputDesc').value.trim();
      const deadline = document.getElementById('inputDeadline').value;
      const maxScore = parseInt(document.getElementById('inputMaxScore').value) || 100;

      if (!title) { alert('Judul wajib diisi'); return; }
      if (!deadline) { alert('Deadline wajib diisi'); return; }

      const btn = document.getElementById('btnSave');
      btn.disabled = true; btn.textContent = 'Menyimpan...';

      try {
        await createActivity({
          classId: currentContext.classId,
          subjectId: currentContext.subjectId,
          type, title, description,
          deadline: new Date(deadline).toISOString(),
          maxScore,
          authorId: currentUser.id
        });
        closeModal();
        showToast('✅ Aktivitas dibuat');
        await loadActivities();
      } catch (err) {
        alert('Gagal: ' + err.message);
      } finally {
        btn.disabled = false; btn.textContent = 'Simpan';
      }
    }

    async function deleteConfirm(id) {
      if (!confirm('Hapus aktivitas ini? Semua submission siswa akan ikut terhapus.')) return;
      try {
        await deleteActivity(id);
        showToast('🗑️ Aktivitas dihapus');
        await loadActivities();
      } catch (err) {
        alert('Gagal: ' + err.message);
      }
    }

    function esc(t) {
      if (t === null || t === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(t);
      return d.innerHTML;
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type === 'error' ? 'error' : '');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
