<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru — Tembok Belajar</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="app-header">
    <div class="app-brand">🧱 Tembok Belajar — Guru</div>
    <div class="app-user">
      <span id="schoolName" style="font-size:0.75rem; opacity:0.85; margin-right:8px;"></span>
      <span id="userName">Memuat...</span>
      <div class="avatar" id="userAvatar">?</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <div id="loading" class="loading-box">
    <div class="spinner"></div>
    <p>Memuat dashboard...</p>
  </div>

  <div id="dashboard" class="dash-container hidden">
    <div class="dash-hero">
      <h1 id="greeting">Halo!</h1>
      <p class="muted" id="subGreeting"></p>
      <p class="muted" id="schoolInfo" style="margin-top:6px; font-size:0.85rem;"></p>
    </div>

    <div class="stat-grid" id="statsGrid"></div>

    <div class="dash-panel">
      <h2 class="panel-title">📌 Menu Cepat</h2>
      <div class="quick-menu" id="quickMenu"></div>
    </div>

    <div class="dash-panel">
      <h2 class="panel-title">ℹ️ Info</h2>
      <p class="muted">Pilih "Mapel Saya" untuk melihat mapel dan kelas yang Anda ampu.</p>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    (async () => {
      initSupabase();
      const profile = await requireAuth('guru');
      if (!profile) return;

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');

      document.getElementById('userName').textContent = profile.name;
      document.getElementById('userAvatar').textContent = profile.name.charAt(0).toUpperCase();
      document.getElementById('greeting').textContent = 'Halo, ' + profile.name + '!';
      document.getElementById('subGreeting').textContent = 'Guru · ' + profile.email;

      try {
        const school = await getSchool(profile.school_id);
        if (school) {
          document.getElementById('schoolName').textContent = '🏫 ' + school.name;
          document.getElementById('schoolInfo').textContent =
            '🏫 ' + school.name + (school.academic_year ? ' · Tahun Ajaran ' + school.academic_year : '');
        }
      } catch (err) { console.warn('Gagal ambil sekolah:', err); }

      // Statistik nyata
      let totalMapel = 0, totalKelas = 0, totalSiswa = 0, totalAktivitas = 0;
      try {
        const assignments = await getMyTeachingAssignments(profile.id);
        if (assignments && assignments.length > 0) {
          const subjectSet = new Set();
          const classSet = new Set();
          assignments.forEach(a => {
            if (a.subjects) subjectSet.add(a.subjects.id);
            if (a.classes) classSet.add(a.classes.id);
          });
          totalMapel = subjectSet.size;
          totalKelas = classSet.size;
          const counts = await getClassStudentCounts(Array.from(classSet));
          totalSiswa = Object.values(counts).reduce((s, n) => s + n, 0);
        }
      } catch (err) { console.warn('Statistik error:', err); }

      const stats = [
        { label: 'Mapel Diampu', value: totalMapel },
        { label: 'Kelas Diampu', value: totalKelas },
        { label: 'Siswa Diajar', value: totalSiswa },
        { label: 'Aktivitas Dibuat', value: totalAktivitas }
      ];
      document.getElementById('statsGrid').innerHTML = stats.map(s => `
        <div class="stat-card">
          <div class="stat-value">${s.value}</div>
          <div class="stat-label">${s.label}</div>
        </div>
      `).join('');

      const menus = [
        { icon: '📚', label: 'Mapel Saya',            url: 'mapel.html' },
        { icon: '📄', label: 'Materi & Page Builder', url: 'materi.html' },
        { icon: '✏️', label: 'Aktivitas & Tugas',     url: 'aktivitas.html' },
        { icon: '📝', label: 'Penilaian',             url: 'penilaian.html' },
        { icon: '📊', label: 'Grade Book',            url: 'gradebook.html' },
        { icon: '💬', label: 'Forum Kelas',           url: 'forum.html' },
        { icon: '📈', label: 'Progress Siswa',        url: 'progress.html' },
        { icon: '🖨️', label: 'Cetak Rapor',           url: 'cetak-rapor.html' }
      ];
      document.getElementById('quickMenu').innerHTML = menus.map(m => `
        <div class="quick-item" onclick="${m.url === '#'
          ? `alert('Fitur ${m.label} akan dibuat di fase berikutnya.')`
          : `window.location.href='${m.url}'`}">
          <span class="quick-icon">${m.icon}</span>
          <span>${m.label}</span>
        </div>
      `).join('');
    })();
  </script>
</body>
</html>
