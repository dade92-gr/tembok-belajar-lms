<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapel Saya — Tembok Belajar</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .page-container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-toolbar { margin-bottom: 1.5rem; }
    .page-toolbar h1 { font-size: 1.6rem; color: var(--tb-dark); font-weight: 700; }
    .page-toolbar h1 small { display: block; font-size: 0.8rem; font-weight: 400; color: var(--tb-text-muted); margin-top: 4px; }
    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: white; border-radius: var(--tb-radius); padding: 1.3rem 1rem; text-align: center;
      border: 1px solid rgba(46,204,113,0.1); box-shadow: var(--tb-shadow-sm);
    }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--tb-primary); line-height: 1; }
    .stat-label { font-size: 0.75rem; color: var(--tb-text-muted); margin-top: 0.3rem; font-weight: 500; }

    .mapel-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.2rem;
    }
    .mapel-card {
      background: white; border-radius: var(--tb-radius-lg);
      border: 1px solid rgba(46,204,113,0.1);
      box-shadow: var(--tb-shadow-sm);
      overflow: hidden; transition: var(--tb-transition); cursor: pointer;
    }
    .mapel-card:hover {
      transform: translateY(-4px); box-shadow: var(--tb-shadow); border-color: var(--tb-primary);
    }
    .mapel-header {
      padding: 1.2rem 1.4rem;
      background: linear-gradient(135deg, var(--tb-primary), var(--tb-secondary));
      color: white;
    }
    .mapel-header h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.2rem; }
    .mapel-header .kode { font-size: 0.75rem; opacity: 0.9; font-family: monospace; }
    .mapel-body { padding: 1.2rem 1.4rem; }
    .mapel-info { font-size: 0.8rem; color: var(--tb-text-muted); margin-bottom: 0.8rem; }
    .kelas-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.5rem; }
    .kelas-badge {
      display: inline-block; background: #fef9e7; color: #b7791f;
      padding: 3px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: 600;
    }
    .kelas-badge small { opacity: 0.7; font-weight: 400; }

    .empty-state {
      background: white; border-radius: var(--tb-radius-lg);
      border: 1px solid rgba(46,204,113,0.1); padding: 3rem 2rem;
      text-align: center; box-shadow: var(--tb-shadow-sm);
    }
    .empty-state .emoji { font-size: 3.5rem; display: block; margin-bottom: 1rem; opacity: 0.5; }
    .empty-state h3 { font-size: 1.1rem; color: var(--tb-dark); margin-bottom: 0.5rem; }
    .empty-state p { color: var(--tb-text-muted); font-size: 0.85rem; }

    .back-nav { text-align: center; margin-top: 2rem; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      background: white; color: var(--tb-dark);
      padding: 0.6rem 1.5rem; border-radius: 30px;
      text-decoration: none; font-weight: 600; border: 1px solid var(--tb-light);
      transition: var(--tb-transition); font-size: 0.85rem;
    }
    .btn-secondary:hover { background: var(--tb-light); }

    @media (max-width: 600px) { .page-container { padding: 1.2rem 1rem; } .mapel-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-brand">🧱 Tembok Belajar — Guru</div>
    <div class="app-user">
      <span id="userName">Memuat...</span>
      <div class="avatar" id="userAvatar">?</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <div id="loading" class="loading-box"><div class="spinner"></div><p>Memuat mapel...</p></div>

  <div class="page-container hidden" id="pageContent">
    <div class="page-toolbar">
      <h1>📚 Mapel Saya
        <small>Mata pelajaran dan kelas yang Anda ampu</small>
      </h1>
    </div>
    <div class="stat-grid" id="statsGrid"></div>
    <div id="mapelGrid" class="mapel-grid"></div>
    <div class="back-nav">
      <a href="dashboard.html" class="btn-secondary">← Kembali ke Dashboard</a>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    let currentUser = null;

    (async () => {
      initSupabase();
      currentUser = await requireAuth('guru');
      if (!currentUser) return;
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
      await loadData();
    })();

    async function loadData() {
      try {
        const assignments = await getMyTeachingAssignments(currentUser.id);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('pageContent').classList.remove('hidden');

        if (!assignments || assignments.length === 0) {
          document.getElementById('statsGrid').innerHTML = '';
          document.getElementById('mapelGrid').innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
              <span class="emoji">📚</span>
              <h3>Belum Ada Mapel yang Diampu</h3>
              <p>Hubungi operator sekolah Anda untuk ditugaskan mengampu mapel.</p>
            </div>`;
          return;
        }

        const mapelMap = {};
        const allClassIds = new Set();
        assignments.forEach(a => {
          if (!a.subjects) return;
          const sid = a.subjects.id;
          if (!mapelMap[sid]) mapelMap[sid] = { subject: a.subjects, classes: [] };
          if (a.classes && !mapelMap[sid].classes.find(c => c.id === a.classes.id)) {
            mapelMap[sid].classes.push(a.classes);
            allClassIds.add(a.classes.id);
          }
        });

        const counts = await getClassStudentCounts(Array.from(allClassIds));
        const totalMapel = Object.keys(mapelMap).length;
        const totalKelas = allClassIds.size;
        const totalSiswa = Object.values(counts).reduce((s, n) => s + n, 0);

        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="stat-value">${totalMapel}</div><div class="stat-label">Mapel Diampu</div></div>
          <div class="stat-card"><div class="stat-value">${totalKelas}</div><div class="stat-label">Kelas Diampu</div></div>
          <div class="stat-card"><div class="stat-value">${totalSiswa}</div><div class="stat-label">Siswa Diajar</div></div>
        `;

        document.getElementById('mapelGrid').innerHTML = Object.values(mapelMap).map(m => {
          const badges = m.classes.map(c => {
            const n = counts[c.id] || 0;
            return `<span class="kelas-badge">🏫 ${esc(c.name)} <small>(${n} siswa)</small></span>`;
          }).join('');
          const tot = m.classes.reduce((s, c) => s + (counts[c.id] || 0), 0);
          return `
            <div class="mapel-card" onclick="openMapel(${m.subject.id})">
              <div class="mapel-header">
                <h3>${esc(m.subject.name)}</h3>
                <div class="kode">${esc(m.subject.code || '')}</div>
              </div>
              <div class="mapel-body">
                <div class="mapel-info">${m.classes.length} kelas · ${tot} siswa</div>
                <div class="kelas-badges">${badges}</div>
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        console.error('Load error:', err);
        document.getElementById('loading').innerHTML = '<p style="color:red;">Error: ' + err.message + '</p>';
      }
    }

    function openMapel(subjectId) {
      // Simpan subject & buka kelas.html (nanti pilih kelas)
      const assignments = null; // placeholder
      // Arahkan ke kelas.html — nanti di sana user pilih kelas
      window.location.href = 'kelas.html?subject=' + subjectId;
    }

    function esc(t) {
      if (t === null || t === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(t);
      return d.innerHTML;
    }
  </script>
</body>
</html>
