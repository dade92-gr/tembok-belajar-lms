<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi Belajar — Tembok Belajar</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .page-container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-toolbar { margin-bottom: 1.5rem; }
    .page-toolbar h1 { font-size: 1.6rem; color: var(--tb-dark); font-weight: 700; }
    .page-toolbar h1 small { display: block; font-size: 0.8rem; font-weight: 400; color: var(--tb-text-muted); margin-top: 4px; }

    .selector-row {
      background: white; border-radius: var(--tb-radius-lg);
      padding: 1rem 1.5rem; margin-bottom: 1.5rem;
      box-shadow: var(--tb-shadow-sm);
      display: flex; gap: 1rem; flex-wrap: wrap;
    }
    .selector-row > div { flex: 1; min-width: 200px; }
    .selector-row label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--tb-dark); margin-bottom: 0.4rem; }
    .selector-row select {
      width: 100%; padding: 0.6rem 0.8rem;
      border: 1px solid var(--tb-border); border-radius: 10px;
      font-size: 0.85rem; font-family: inherit; cursor: pointer;
    }

    .two-col { display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; }
    .panel {
      background: white; border-radius: var(--tb-radius-lg);
      border: 1px solid rgba(46,204,113,0.1);
      padding: 1.5rem; box-shadow: var(--tb-shadow-sm);
    }
    .panel-title {
      font-size: 1rem; font-weight: 700; color: var(--tb-dark);
      margin-bottom: 1rem; padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--tb-light);
    }

    .page-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .page-item {
      padding: 0.7rem 0.9rem; border-radius: 10px;
      background: var(--tb-bg); cursor: pointer;
      font-size: 0.85rem; transition: var(--tb-transition);
    }
    .page-item:hover { background: var(--tb-light); }
    .page-item.active { background: var(--tb-light); border-left: 3px solid var(--tb-primary); font-weight: 600; }

    .page-content h1, .page-content h2, .page-content h3 { color: var(--tb-dark); margin: 1rem 0 0.5rem; }
    .page-content p { margin-bottom: 0.8rem; line-height: 1.7; }
    .page-content img { max-width: 100%; border-radius: 10px; margin: 0.5rem 0; }
    .page-content iframe { width: 100%; max-width: 720px; height: 400px; border: none; border-radius: 10px; margin: 0.5rem 0; }
    .page-content a { color: var(--tb-primary); word-break: break-all; }

    .empty-msg { text-align: center; color: var(--tb-text-muted); padding: 2rem; font-size: 0.85rem; }

    .back-nav { text-align: center; margin-top: 2rem; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      background: white; color: var(--tb-dark);
      padding: 0.6rem 1.5rem; border-radius: 30px;
      text-decoration: none; font-weight: 600; border: 1px solid var(--tb-light);
      font-size: 0.85rem;
    }
    .btn-secondary:hover { background: var(--tb-light); }

    @media (max-width: 768px) {
      .page-container { padding: 1.2rem 1rem; }
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-brand">🧱 Tembok Belajar — Siswa</div>
    <div class="app-user">
      <span id="userName">Memuat...</span>
      <div class="avatar" id="userAvatar">?</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <div id="loading" class="loading-box"><div class="spinner"></div><p>Memuat materi...</p></div>

  <div class="page-container hidden" id="pageContent">
    <div class="page-toolbar">
      <h1>📄 Materi Belajar
        <small>Baca materi yang sudah disiapkan guru</small>
      </h1>
    </div>

    <div class="selector-row">
      <div>
        <label>Mata Pelajaran</label>
        <select id="selSubject" onchange="onSubjectChange()"></select>
      </div>
      <div>
        <label>Kelas</label>
        <select id="selClass" onchange="loadPages()"></select>
      </div>
    </div>

    <div class="two-col">
      <div class="panel">
        <h2 class="panel-title">📑 Daftar Halaman</h2>
        <div class="page-list" id="pageList">
          <div class="empty-msg">Pilih mapel dan kelas</div>
        </div>
      </div>

      <div class="panel">
        <h2 class="panel-title" id="contentTitle">📖 Konten</h2>
        <div class="page-content" id="contentArea">
          <div class="empty-msg">Pilih halaman untuk membaca</div>
        </div>
      </div>
    </div>

    <div class="back-nav">
      <a href="dashboard.html" class="btn-secondary">← Kembali ke Dashboard</a>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    let currentUser = null;
    let allAssigns = [];
    let allPages = [];
    let currentPage = null;

    (async () => {
      initSupabase();
      currentUser = await requireAuth('siswa');
      if (!currentUser) return;
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();

      try {
        allAssigns = await getMyEnrolledSubjects(currentUser.id);

        // Isi dropdown subject (unique)
        const subjectsMap = {};
        allAssigns.forEach(a => {
          if (a.subjects) subjectsMap[a.subjects.id] = a.subjects;
        });
        const selSubject = document.getElementById('selSubject');
        selSubject.innerHTML = '<option value="">-- Pilih Mapel --</option>' +
          Object.values(subjectsMap).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');

        // Pre-select dari URL param
        const params = new URLSearchParams(window.location.search);
        const sid = params.get('subject');
        if (sid) {
          selSubject.value = sid;
          onSubjectChange();
        }
      } catch (err) {
        console.error(err);
      }

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('pageContent').classList.remove('hidden');
    })();

    function onSubjectChange() {
      const sid = parseInt(document.getElementById('selSubject').value);
      const selClass = document.getElementById('selClass');
      if (!sid) {
        selClass.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        return;
      }
      const classes = allAssigns.filter(a => a.subjects && a.subjects.id === sid)
        .map(a => a.classes).filter(Boolean)
        .filter((v, i, self) => self.findIndex(x => x.id === v.id) === i);
      selClass.innerHTML = '<option value="">-- Pilih Kelas --</option>' +
        classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
      if (classes.length === 1) {
        selClass.value = classes[0].id;
        loadPages();
      }
    }

    async function loadPages() {
      const sid = parseInt(document.getElementById('selSubject').value);
      const cid = parseInt(document.getElementById('selClass').value);
      const pageList = document.getElementById('pageList');
      const contentArea = document.getElementById('contentArea');
      const contentTitle = document.getElementById('contentTitle');

      if (!sid || !cid) {
        pageList.innerHTML = '<div class="empty-msg">Pilih mapel dan kelas</div>';
        contentArea.innerHTML = '<div class="empty-msg">Pilih halaman</div>';
        return;
      }

      pageList.innerHTML = '<div class="empty-msg">Memuat...</div>';
      try {
        allPages = await getPages(cid, sid);
        if (allPages.length === 0) {
          pageList.innerHTML = '<div class="empty-msg">Belum ada materi di kelas ini</div>';
          contentArea.innerHTML = '<div class="empty-msg">Belum ada materi</div>';
          return;
        }
        pageList.innerHTML = allPages.map(p => `
          <div class="page-item" onclick="selectPage(${p.id})">${esc(p.title)}</div>
        `).join('');

        // Auto-load page pertama
        selectPage(allPages[0].id);
      } catch (err) {
        pageList.innerHTML = '<div class="empty-msg" style="color:red;">Error: ' + err.message + '</div>';
      }
    }

    async function selectPage(pageId) {
      currentPage = allPages.find(p => p.id === pageId);
      if (!currentPage) return;

      document.querySelectorAll('.page-item').forEach((el, i) => {
        el.classList.toggle('active', allPages[i].id === pageId);
      });

      const contentArea = document.getElementById('contentArea');
      const contentTitle = document.getElementById('contentTitle');
      contentTitle.textContent = '📖 ' + currentPage.title;
      contentArea.innerHTML = '<div class="empty-msg">Memuat konten...</div>';

      try {
        const blocks = await getBlocks(pageId);
        if (blocks.length === 0) {
          contentArea.innerHTML = '<div class="empty-msg">Halaman ini belum memiliki konten</div>';
          return;
        }
        contentArea.innerHTML = blocks.map(b => renderBlock(b)).join('');
      } catch (err) {
        contentArea.innerHTML = '<div class="empty-msg" style="color:red;">Error: ' + err.message + '</div>';
      }
    }

    function renderBlock(b) {
      const d = b.data || {};
      if (b.type === 'text') {
        return '<p>' + (d.content || '').replace(/\n/g, '<br>') + '</p>';
      }
      if (b.type === 'image') {
        const img = d.url ? `<img src="${esc(d.url)}" alt="${esc(d.caption || '')}">` : '';
        const cap = d.caption ? `<p style="font-size:0.8rem; color:#888; text-align:center;">${esc(d.caption)}</p>` : '';
        return img + cap;
      }
      if (b.type === 'video') {
        const yt = (d.url || '').match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]+)/);
        if (yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe>`;
        return d.url ? `<p><a href="${esc(d.url)}" target="_blank">${esc(d.url)}</a></p>` : '';
      }
      if (b.type === 'file') {
        return d.url ? `<p>📎 <a href="${esc(d.url)}" target="_blank">${esc(d.name || d.url)}</a></p>` : '';
      }
      return '';
    }

    function esc(t) {
      if (t === null || t === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(t);
      return d.innerHTML;
    }
  </script>
</body>
</html>
