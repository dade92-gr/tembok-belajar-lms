<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapel Saya — Tembok Belajar</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .page-container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-toolbar { margin-bottom: 1.5rem; }
    .page-toolbar h1 { font-size: 1.6rem; color: var(--tb-dark); font-weight: 700; }
    .page-toolbar h1 small { display: block; font-size: 0.8rem; font-weight: 400; color: var(--tb-text-muted); margin-top: 4px; }

    .mapel-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.2rem;
    }
    .mapel-card {
      background: white; border-radius: var(--tb-radius-lg);
      border: 1px solid rgba(46,204,113,0.1);
      box-shadow: var(--tb-shadow-sm); overflow: hidden;
      transition: var(--tb-transition); cursor: pointer;
    }
    .mapel-card:hover {
      transform: translateY(-4px); box-shadow: var(--tb-shadow); border-color: var(--tb-primary);
    }
    .mapel-header {
      padding: 1.2rem 1.4rem;
      background: linear-gradient(135deg, var(--tb-primary), var(--tb-secondary));
      color: white;
    }
    .mapel-header h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.2rem; }
    .mapel-header .kode { font-size: 0.75rem; opacity: 0.9; font-family: monospace; }
    .mapel-body { padding: 1.2rem 1.4rem; }
    .mapel-info { font-size: 0.8rem; color: var(--tb-text-muted); }
    .mapel-info .kelas-name { color: var(--tb-dark); font-weight: 600; }

    .empty-state {
      background: white; border-radius: var(--tb-radius-lg);
      border: 1px solid rgba(46,204,113,0.1); padding: 3rem 2rem;
      text-align: center; box-shadow: var(--tb-shadow-sm);
    }
    .empty-state .emoji { font-size: 3.5rem; display: block; margin-bottom: 1rem; opacity: 0.5; }
    .empty-state h3 { font-size: 1.1rem; color: var(--tb-dark); margin-bottom: 0.5rem; }
    .empty-state p { color: var(--tb-text-muted); font-size: 0.85rem; }

    .back-nav { text-align: center; margin-top: 2rem; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      background: white; color: var(--tb-dark);
      padding: 0.6rem 1.5rem; border-radius: 30px;
      text-decoration: none; font-weight: 600; border: 1px solid var(--tb-light);
      font-size: 0.85rem;
    }
    .btn-secondary:hover { background: var(--tb-light); }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-brand">🧱 Tembok Belajar — Siswa</div>
    <div class="app-user">
      <span id="userName">Memuat...</span>
      <div class="avatar" id="userAvatar">?</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <div id="loading" class="loading-box"><div class="spinner"></div><p>Memuat mapel...</p></div>

  <div class="page-container hidden" id="pageContent">
    <div class="page-toolbar">
      <h1>📚 Mapel Saya
        <small>Mata pelajaran dan kelas yang Anda ikuti</small>
      </h1>
    </div>
    <div id="mapelGrid" class="mapel-grid"></div>
    <div class="back-nav">
      <a href="dashboard.html" class="btn-secondary">← Kembali ke Dashboard</a>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    let currentUser = null;

    (async () => {
      initSupabase();
      currentUser = await requireAuth('siswa');
      if (!currentUser) return;
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
      await loadData();
    })();

    async function loadData() {
      try {
        const assigns = await getMyEnrolledSubjects(currentUser.id);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('pageContent').classList.remove('hidden');

        if (!assigns || assigns.length === 0) {
          document.getElementById('mapelGrid').innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
              <span class="emoji">📚</span>
              <h3>Belum Terdaftar di Kelas</h3>
              <p>Hubungi operator sekolah Anda untuk didaftarkan ke kelas.</p>
            </div>`;
          return;
        }

        // Grouping per subject (unique by subject id)
        const grouped = {};
        assigns.forEach(a => {
          if (!a.subjects) return;
          const sid = a.subjects.id;
          if (!grouped[sid]) {
            grouped[sid] = { subject: a.subjects, classes: [], teachers: new Set() };
          }
          if (a.classes && !grouped[sid].classes.find(c => c.id === a.classes.id)) {
            grouped[sid].classes.push(a.classes);
          }
          if (a.profiles?.name) grouped[sid].teachers.add(a.profiles.name);
        });

        document.getElementById('mapelGrid').innerHTML = Object.values(grouped).map(g => {
          const kelasBadges = g.classes.map(c => 
            `<span style="display:inline-block; background:#fef9e7; color:#b7791f; padding:2px 8px; border-radius:8px; font-size:0.7rem; font-weight:600; margin:2px;">🏫 ${esc(c.name)}</span>`
          ).join('');
          const teacherText = Array.from(g.teachers).join(', ');
          return `
            <div class="mapel-card" onclick="openMapel(${g.subject.id})">
              <div class="mapel-header">
                <h3>${esc(g.subject.name)}</h3>
                <div class="kode">${esc(g.subject.code || '')}</div>
              </div>
              <div class="mapel-body">
                <div class="mapel-info">
                  <div style="margin-bottom:0.5rem;">👨‍🏫 ${esc(teacherText || '-')}</div>
                  <div>${kelasBadges}</div>
                </div>
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = '<p style="color:red;">Error: ' + err.message + '</p>';
      }
    }

    function openMapel(subjectId) {
      sessionStorage.setItem('siswa_subject', subjectId);
      window.location.href = 'materi.html?subject=' + subjectId;
    }

    function esc(t) {
      if (t === null || t === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(t);
      return d.innerHTML;
    }
  </script>
</body>
</html>
