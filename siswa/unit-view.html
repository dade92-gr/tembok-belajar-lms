      // ============ REFLEKSI ============
      if (type === 'pertanyaan_refleksi') {
        const val = savedValue !== null ? savedValue : '';
        const isTextarea = (data.answer_type || 'textarea') === 'textarea';
        return `<div class="refleksi-question-box">
          <div class="refleksi-question-title"><i class="fas fa-question"></i> Pertanyaan Refleksi</div>
          <div class="refleksi-question-text">${escapeHtml(data.question || '(Belum ada pertanyaan)')}</div>
          ${isTextarea 
            ? `<textarea class="lkpd-input lkpd-textarea" placeholder="${escapeHtml(data.placeholder || 'Refleksimu...')}" oninput="onAnswerChange('${activity.id}', '${comp.id}', this.value)">${escapeHtml(val)}</textarea>`
            : `<input type="text" class="lkpd-input" placeholder="${escapeHtml(data.placeholder || 'Refleksimu...')}" value="${escapeHtml(val)}" oninput="onAnswerChange('${activity.id}', '${comp.id}', this.value)">`}
        </div>`;
      }

      // FIX A6: mood tracker simpan index bukan text
      if (type === 'mood_tracker') {
        const opts = data.options || [];
        return `<div class="refleksi-question-box">
          <div class="refleksi-question-title"><i class="fas fa-face-smile"></i> ${escapeHtml(data.label || 'Mood Tracker')}</div>
          <div class="mood-grid">
            ${opts.map((o, i) => {
              const parts = o.split(' ');
              const emoji = parts[0] || '😐';
              const label = parts.slice(1).join(' ') || o;
              const isChecked = String(savedValue) === String(i) || savedValue === o;
              return `<div class="mood-item-card ${isChecked ? 'checked' : ''}" 
                data-activity-id="${activity.id}" data-comp-id="${comp.id}" data-option-index="${i}" data-value="${escapeHtml(o)}">
                <span class="mood-emoji">${emoji}</span>
                <span>${escapeHtml(label)}</span>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }

      if (type === 'target_belajar') {
        const val = savedValue !== null ? savedValue : '';
        return `<div class="refleksi-question-box">
          <div class="refleksi-question-title"><i class="fas fa-bullseye"></i> Target Belajar</div>
          <div class="refleksi-question-text">${escapeHtml(data.label || '(Belum ada label)')}</div>
          <input type="text" class="lkpd-input" placeholder="${escapeHtml(data.placeholder || 'Targetmu...')}" value="${escapeHtml(val)}" oninput="onAnswerChange('${activity.id}', '${comp.id}', this.value)">
        </div>`;
      }

      if (type === 'tombol_submit_refleksi') {
        return '';
      }

      // ============ DISKUSI ============
      if (type === 'topik_diskusi') {
        return `<div class="diskusi-topik-box">
          <div class="diskusi-topik-title"><i class="fas fa-comment-dots"></i> ${escapeHtml(data.title || 'Topik Diskusi')}</div>
          <div class="diskusi-topik-desc">${escapeHtml(data.description || '')}</div>
        </div>`;
      }

      if (type === 'aturan_diskusi') {
        return `<div class="diskusi-aturan-box">
          <div class="diskusi-aturan-title"><i class="fas fa-scroll"></i> ${escapeHtml(data.title || 'Aturan Diskusi')}</div>
          <div class="diskusi-aturan-text">${escapeHtml(data.text || '')}</div>
        </div>`;
      }

      if (type === 'kolom_komentar') {
        return renderKomentarBox(activity, data);
      }

      return `<p style="color:var(--text-muted); font-style:italic; font-size:0.85rem;">[Komponen "${escapeHtml(type)}"]</p>`;
    }

    // ============================================
    // KOMENTAR (forum per aktivitas)
    // ============================================
    function renderKomentarBox(activity, data) {
      const posts = allForumPosts.filter(p => String(p.activity_id) === String(activity.id) && !p.parent_id);

      const postsHtml = posts.length === 0
        ? `<div style="text-align:center; padding:1rem; color:var(--text-muted); font-size:0.82rem; font-style:italic;">Belum ada komentar. Mulai diskusi!</div>`
        : posts.map(p => {
            const author = p.profiles || {};
            const role = author.role || 'siswa';
            const initials = (author.name || '?').charAt(0).toUpperCase();
            return `<div class="komentar-item">
              <div class="komentar-item-header">
                <div class="komentar-author-avatar">${initials}</div>
                <span class="komentar-author-name">${escapeHtml(author.name || '-')}</span>
                <span class="komentar-role-badge ${role}">${role === 'guru' ? 'Guru' : 'Siswa'}</span>
                <span class="komentar-time">${formatDate(p.created_at)}</span>
              </div>
              <div class="komentar-body">${escapeHtml(p.body || '')}</div>
            </div>`;
          }).join('');

      return `<div class="komentar-box" data-komentar-activity="${activity.id}">
        <div class="komentar-header"><i class="fas fa-comments"></i> ${escapeHtml(data.label || 'Diskusi Kelas')}</div>
        <div class="komentar-list">${postsHtml}</div>
        <div class="komentar-form">
          <input type="text" class="komentar-input" data-activity-id="${activity.id}" placeholder="${escapeHtml(data.placeholder || 'Tulis komentar...')}" maxlength="500">
          <button class="komentar-submit-btn" data-activity-id="${activity.id}"><i class="fas fa-paper-plane"></i> Kirim</button>
        </div>
      </div>`;
    }

    // ============================================
    // ANSWER MANAGEMENT (auto-save)
    // ============================================
    function getActivityAnswers(activityId) {
      const sub = allSubmissions.find(s => String(s.activity_id) === String(activityId));
      if (sub && sub.answers && typeof sub.answers === 'object') {
        return sub.answers;
      }
      const refl = allReflections.find(r => String(r.activity_id) === String(activityId));
      if (refl && refl.answers && typeof refl.answers === 'object') {
        return refl.answers;
      }
      if (answersCache[activityId]) return answersCache[activityId];
      return {};
    }

    function onAnswerChange(activityId, compId, value) {
      if (!answersCache[activityId]) answersCache[activityId] = {};
      answersCache[activityId][compId] = { value };
      debounceSave(activityId);
    }

    function onTableCellChange(activityId, compId, cellKey, value) {
      if (!answersCache[activityId]) answersCache[activityId] = {};
      if (!answersCache[activityId][compId]) answersCache[activityId][compId] = { value: {} };
      if (typeof answersCache[activityId][compId].value !== 'object') {
        answersCache[activityId][compId].value = {};
      }
      answersCache[activityId][compId].value[cellKey] = value;
      debounceSave(activityId);
    }

    function onMenjodohkanChange(activityId, compId, leftIdx, value) {
      if (!answersCache[activityId]) answersCache[activityId] = {};
      if (!answersCache[activityId][compId]) answersCache[activityId][compId] = { value: {} };
      if (typeof answersCache[activityId][compId].value !== 'object') {
        answersCache[activityId][compId].value = {};
      }
      answersCache[activityId][compId].value[leftIdx] = value;
      debounceSave(activityId);
    }

    // ============================================
    // FIX A5 + A6 + A7: Event delegation — TANPA setTimeout, TANPA inline onclick
    // ============================================
    document.addEventListener('click', (e) => {
      // LKPD checkbox/radio
      const optItem = e.target.closest('.lkpd-option-item');
      if (optItem) {
        e.preventDefault();
        const activityId = optItem.dataset.activityId;
        const compId = optItem.dataset.compId;
        const inputType = optItem.dataset.inputType;
        const optionIndex = parseInt(optItem.dataset.optionIndex, 10);

        const container = optItem.parentElement;
        if (inputType === 'radio') {
          container.querySelectorAll('.lkpd-option-item').forEach(el => el.classList.remove('checked'));
          optItem.classList.add('checked');
          if (!answersCache[activityId]) answersCache[activityId] = {};
          answersCache[activityId][compId] = { value: optionIndex };
        } else {
          optItem.classList.toggle('checked');
          const checkedIndices = [];
          container.querySelectorAll('.lkpd-option-item.checked').forEach(el => {
            checkedIndices.push(parseInt(el.dataset.optionIndex, 10));
          });
          if (!answersCache[activityId]) answersCache[activityId] = {};
          answersCache[activityId][compId] = { value: checkedIndices };
        }
        debounceSave(activityId);
        return;
      }

      // Penilaian diri
      const pdItem = e.target.closest('.penilaian-diri-item');
      if (pdItem) {
        e.preventDefault();
        const activityId = pdItem.dataset.activityId;
        const compId = pdItem.dataset.compId;
        const value = parseInt(pdItem.dataset.value, 10);

        const container = pdItem.parentElement;
        container.querySelectorAll('.penilaian-diri-item').forEach(el => el.classList.remove('checked'));
        pdItem.classList.add('checked');
        if (!answersCache[activityId]) answersCache[activityId] = {};
        answersCache[activityId][compId] = { value };
        debounceSave(activityId);
        return;
      }

      // Asesmen PG
      const asesmenPg = e.target.closest('.asesmen-jawaban-item[data-option-index]');
      if (asesmenPg) {
        e.preventDefault();
        const activityId = asesmenPg.dataset.activityId;
        const compId = asesmenPg.dataset.compId;
        const optionIndex = parseInt(asesmenPg.dataset.optionIndex, 10);

        const container = asesmenPg.parentElement;
        container.querySelectorAll('.asesmen-jawaban-item').forEach(el => el.classList.remove('checked'));
        asesmenPg.classList.add('checked');
        if (!answersCache[activityId]) answersCache[activityId] = {};
        answersCache[activityId][compId] = { value: optionIndex };
        debounceSave(activityId);
        return;
      }

      // Asesmen Benar/Salah
      const asesmenBs = e.target.closest('.asesmen-jawaban-item[data-value]');
      if (asesmenBs && !asesmenBs.dataset.optionIndex) {
        e.preventDefault();
        const activityId = asesmenBs.dataset.activityId;
        const compId = asesmenBs.dataset.compId;
        const rawVal = asesmenBs.dataset.value;
        const value = rawVal === 'true' ? true : (rawVal === 'false' ? false : rawVal);

        const container = asesmenBs.parentElement;
        container.querySelectorAll('.asesmen-jawaban-item').forEach(el => el.classList.remove('checked'));
        asesmenBs.classList.add('checked');
        if (!answersCache[activityId]) answersCache[activityId] = {};
        answersCache[activityId][compId] = { value };
        debounceSave(activityId);
        return;
      }

      // Mood tracker
      const moodItem = e.target.closest('.mood-item-card');
      if (moodItem) {
        e.preventDefault();
        const activityId = moodItem.dataset.activityId;
        const compId = moodItem.dataset.compId;
        const optionIndex = parseInt(moodItem.dataset.optionIndex, 10);
        const value = moodItem.dataset.value;

        const container = moodItem.parentElement;
        container.querySelectorAll('.mood-item-card').forEach(el => el.classList.remove('checked'));
        moodItem.classList.add('checked');
               if (!answersCache[activityId]) answersCache[activityId] = {};
        answersCache[activityId][compId] = { value: optionIndex, raw: value };
        debounceSave(activityId);
        return;
      }

      // Tombol kirim komentar
      const komentarBtn = e.target.closest('.komentar-submit-btn');
      if (komentarBtn) {
        e.preventDefault();
        const activityId = komentarBtn.dataset.activityId;
        submitKomentar(activityId);
        return;
      }
    });

    // Enter di input komentar → submit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.classList.contains('komentar-input')) {
        e.preventDefault();
        const activityId = e.target.dataset.activityId;
        submitKomentar(activityId);
      }
    });

    // ============================================
    // DEBOUNCE SAVE
    // ============================================
    function debounceSave(activityId) {
      if (saveTimers[activityId]) clearTimeout(saveTimers[activityId]);
      saveTimers[activityId] = setTimeout(async () => {
        await flushSave(activityId);
      }, 1500);
    }

    // ============================================
    // FIX A2: pakai .limit(1).maybeSingle() agar tidak error PGRST116
    // ============================================
    async function flushSave(activityId) {
      if (!answersCache[activityId]) return;

      const activity = activities.find(a => String(a.id) === String(activityId));
      if (!activity) return;

      const isRefleksi = activity.type === 'refleksi';
      const answers = answersCache[activityId];

      try {
        const client = initSupabase();

        if (isRefleksi) {
          const { data: existing } = await client.from('reflections')
            .select('id').eq('activity_id', activityId).eq('student_id', currentUser.id).limit(1).maybeSingle();

          if (existing) {
            await client.from('reflections').update({ answers, submitted_at: new Date().toISOString() }).eq('id', existing.id);
          } else {
            await client.from('reflections').insert([{ activity_id: activityId, student_id: currentUser.id, answers }]);
          }
        } else {
          // FIX A2: limit(1) → hindari error multiple rows
          const { data: existing } = await client.from('submissions')
            .select('id, status').eq('activity_id', activityId).eq('student_id', currentUser.id).limit(1).maybeSingle();

          if (existing) {
            // Jangan reset status 'submitted'/'graded' jadi 'draft'
            const payload = { answers };
            if (existing.status === 'draft' || !existing.status) payload.status = 'draft';
            await client.from('submissions').update(payload).eq('id', existing.id);
          } else {
            await client.from('submissions').insert([{
              activity_id: activityId,
              student_id: currentUser.id,
              answers,
              status: 'draft'
            }]);
          }
        }

        showSaveIndicator();
        delete saveTimers[activityId];
      } catch (err) {
        console.error('Save error:', err);
        showToast('Gagal auto-save: ' + err.message, 'error');
      }
    }

    // ============================================
    // SUBMIT ACTIVITY (final)
    // ============================================
    async function submitCurrentActivity() {
      if (submitting) return;
      const activity = activities.find(a => String(a.id) === String(activeActivityId));
      if (!activity) return;

      if (!confirm('Kumpulkan jawaban Anda? Setelah dikumpulkan, Anda masih bisa mengubah, tapi akan ditandai sebagai revisi.')) return;

      submitting = true;

      try {
        if (saveTimers[activity.id]) {
          clearTimeout(saveTimers[activity.id]);
          await flushSave(activity.id);
        }

        const client = initSupabase();
        const isRefleksi = activity.type === 'refleksi';

        if (isRefleksi) {
          await client.from('reflections')
            .update({ submitted_at: new Date().toISOString() })
            .eq('activity_id', activity.id)
            .eq('student_id', currentUser.id);
        } else {
          // FIX A2: limit(1)
          const { data: existing } = await client.from('submissions')
            .select('id').eq('activity_id', activity.id).eq('student_id', currentUser.id).limit(1).maybeSingle();

          if (existing) {
            await client.from('submissions').update({
              status: 'submitted',
              submitted_at: new Date().toISOString()
            }).eq('id', existing.id);
          } else {
            await client.from('submissions').insert([{
              activity_id: activity.id,
              student_id: currentUser.id,
              answers: answersCache[activity.id] || {},
              status: 'submitted',
              submitted_at: new Date().toISOString()
            }]);
          }

          try {
            await upsertProgress({
              studentId: currentUser.id,
              unitId: currentUnit.id,
              activityId: activity.id,
              status: 'completed',
              completedAt: new Date().toISOString()
            });
          } catch (e) { console.warn('Progress error:', e); }
        }

        showToast('✅ Aktivitas berhasil dikumpulkan!', 'success');

        await loadUserSubmissions(currentUnit.id);
        renderActivityList();
        await renderActiveActivity();
        updateProgressBadge();
      } catch (err) {
        console.error('Submit error:', err);
        showToast('Gagal submit: ' + err.message, 'error');
      } finally {
        submitting = false;
      }
    }

    // ============================================
    // KOMENTAR (forum per aktivitas)
    // FIX A1: title TIDAK NULL → kirim title string
    // ============================================
    async function submitKomentar(activityId) {
      const input = document.querySelector(`.komentar-input[data-activity-id="${activityId}"]`);
      if (!input) return;
      const body = input.value.trim();
      if (!body) return;

      const activity = activities.find(a => String(a.id) === String(activityId));
      if (!activity) return;

      try {
        const client = initSupabase();
        const { error } = await client.from('forum_posts').insert([{
          unit_id: currentUnit.id,
          activity_id: activityId,
          class_id: currentPlan?.class_id || null,
          subject_id: currentPlan?.subject_id || null,
          author_id: currentUser.id,
          // FIX A1: title NOT NULL — kirim string
          title: 'Komentar dari ' + (currentUser.name || 'Siswa'),
          body: body,
          parent_id: null
        }]);

        if (error) throw error;

        input.value = '';
        showToast('✅ Komentar terkirim', 'success');

        await loadUserSubmissions(currentUnit.id);
        await renderActiveActivity();
      } catch (err) {
        console.error('Komentar error:', err);
        showToast('Gagal kirim komentar: ' + err.message, 'error');
      }
    }

    // ============================================
    // NAVIGATION
    // ============================================
    function updateFooterNav() {
      const footer = document.getElementById('footerNav');
      if (activities.length === 0) { footer.style.display = 'none'; return; }
      footer.style.display = 'flex';
      const idx = activities.findIndex(a => String(a.id) === String(activeActivityId));
      document.getElementById('navCurrentNum').textContent = idx + 1;
      document.getElementById('navTotalNum').textContent = activities.length;
      document.getElementById('btnPrevAct').disabled = idx <= 0;
      document.getElementById('btnNextAct').disabled = idx >= activities.length - 1;
      updateProgressBadge();
    }

    function updateProgressBadge() {
      const total = activities.length;
      const done = activities.filter(a => checkActivityCompleted(a.id)).length;
      document.getElementById('progressText').textContent = done + '/' + total;
    }

    function goToPrevActivity() {
      const idx = activities.findIndex(a => String(a.id) === String(activeActivityId));
      if (idx > 0) switchActivity(activities[idx - 1].id);
    }
    function goToNextActivity() {
      const idx = activities.findIndex(a => String(a.id) === String(activeActivityId));
      if (idx < activities.length - 1) switchActivity(activities[idx + 1].id);
    }

    function exitUnit() {
      Object.keys(saveTimers).forEach(aid => {
        clearTimeout(saveTimers[aid]);
        flushSave(aid);
      });

      if (window.self !== window.top) {
        window.parent.postMessage({ type: 'SISWA_BACK', view: 'mapel' }, '*');
      } else {
        window.location.href = 'dashboard.html';
      }
    }

    // ============================================
    // UTILS
    // ============================================
    function formatDate(iso) {
      if (!iso) return '-';
      try {
        const d = new Date(iso);
        const now = new Date();
        const diff = (now - d) / 1000;
        if (diff < 60) return 'Baru saja';
        if (diff < 3600) return Math.floor(diff / 60) + ' menit lalu';
        if (diff < 86400) return Math.floor(diff / 3600) + ' jam lalu';
        if (diff < 604800) return Math.floor(diff / 86400) + ' hari lalu';
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch { return iso; }
    }

    function escapeHtml(t) {
      if (t === null || t === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(t);
      return d.innerHTML;
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type === 'error' ? 'error' : 'success');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    function showSaveIndicator() {
      const ind = document.getElementById('saveIndicator');
      ind.classList.add('show');
      clearTimeout(window._saveTimer);
      window._saveTimer = setTimeout(() => ind.classList.remove('show'), 1500);
    }

    // ============================================
    // FIX A4: beforeunload — pakai fetch keepalive (sinkron-ish)
    // ============================================
    window.addEventListener('beforeunload', () => {
      Object.keys(saveTimers).forEach(aid => {
        clearTimeout(saveTimers[aid]);
        // Fire-and-forget dengan keepalive — browser tetap kirim meskipun tab ditutup
        try { flushSaveKeepalive(aid); } catch (e) {}
      });
    });

    async function flushSaveKeepalive(activityId) {
      if (!answersCache[activityId]) return;
      const activity = activities.find(a => String(a.id) === String(activityId));
      if (!activity) return;

      const isRefleksi = activity.type === 'refleksi';
      const answers = answersCache[activityId];
      const client = initSupabase();
      const { data: { session } } = await client.auth.getSession();
      if (!session) return;

      const url = `${SUPABASE_URL}/rest/v1/${isRefleksi ? 'reflections' : 'submissions'}`;
      const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + session.access_token,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      };

      try {
        if (isRefleksi) {
          await fetch(url, {
            method: 'POST',
            headers,
            body: JSON.stringify({ activity_id: activityId, student_id: currentUser.id, answers }),
            keepalive: true
          });
        } else {
          await fetch(url, {
            method: 'POST',
            headers,
            body: JSON.stringify({ activity_id: activityId, student_id: currentUser.id, answers, status: 'draft' }),
            keepalive: true
          });
        }
      } catch (e) {
        console.warn('Keepalive flush error:', e);
      }
    }
  </script>
