<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas & Kuis — Tembok Belajar</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .page-container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-toolbar { margin-bottom: 1.5rem; }
    .page-toolbar h1 { font-size: 1.6rem; color: var(--tb-dark); font-weight: 700; }
    .page-toolbar h1 small { display: block; font-size: 0.8rem; font-weight: 400; color: var(--tb-text-muted); margin-top: 4px; }

    .selector-row {
      background: white; border-radius: var(--tb-radius-lg);
      padding: 1rem 1.5rem; margin-bottom: 1.5rem;
      box-shadow: var(--tb-shadow-sm);
      display: flex; gap: 1rem; flex-wrap: wrap;
    }
    .selector-row > div { flex: 1; min-width: 200px; }
    .selector-row label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--tb-dark); margin-bottom: 0.4rem; }
    .selector-row select {
      width: 100%; padding: 0.6rem 0.8rem;
      border: 1px solid var(--tb-border); border-radius: 10px;
      font-size: 0.85rem; font-family: inherit; cursor: pointer;
    }

    .panel {
      background: white; border-radius: var(--tb-radius-lg);
      border: 1px solid rgba(46,204,113,0.1);
      padding: 1.5rem; box-shadow: var(--tb-shadow-sm);
    }
    .panel-title {
      font-size: 1rem; font-weight: 700; color: var(--tb-dark);
      margin-bottom: 1rem; padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--tb-light);
    }

    .task-list { display: flex; flex-direction: column; gap: 1rem; }
    .task-item {
      background: var(--tb-bg); border-radius: 12px;
      padding: 1.2rem 1.4rem; border-left: 4px solid var(--tb-primary);
    }
    .task-header {
      display: flex; justify-content: space-between; align-items: start;
      gap: 1rem; margin-bottom: 0.6rem; flex-wrap: wrap;
    }
    .task-title { font-weight: 700; color: var(--tb-dark); font-size: 1rem; }
    .task-desc { font-size: 0.85rem; color: var(--tb-text); margin-bottom: 0.8rem; line-height: 1.6; white-space: pre-wrap; }
    .task-meta {
      display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.75rem;
      color: var(--tb-text-muted); margin-bottom: 0.8rem;
    }
    .badge {
      padding: 3px 10px; border-radius: 20px;
      font-size: 0.7rem; font-weight: 700;
    }
    .badge-green { background: var(--tb-light); color: var(--tb-dark); }
    .badge-yellow { background: #fff3cd; color: #856404; }
    .badge-red { background: #fadbd8; color: #c0392b; }
    .badge-blue { background: #e8f4fd; color: #2980b9; }

    .submission-box {
      background: white; border-radius: 10px;
      padding: 0.8rem 1rem; margin-top: 0.5rem;
      font-size: 0.8rem;
    }
    .submission-box .label { font-weight: 600; color: var(--tb-dark); margin-bottom: 0.3rem; }
    .submission-box .val { color: var(--tb-text); word-break: break-word; }
    .submission-box .val a { color: var(--tb-primary); }

    .submit-form { margin-top: 1rem; display: none; }
    .submit-form.active { display: block; }
    .submit-form textarea {
      width: 100%; padding: 0.7rem; border: 1px solid var(--tb-border);
      border-radius: 8px; font-family: inherit; font-size: 0.85rem;
      resize: vertical; min-height: 80px; margin-bottom: 0.5rem;
    }
    .submit-form input[type="text"] {
      width: 100%; padding: 0.7rem; border: 1px solid var(--tb-border);
      border-radius: 8px; font-family: inherit; font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
    .btn-submit {
      background: linear-gradient(135deg, var(--tb-primary), var(--tb-secondary));
      color: white; border: none; padding: 0.5rem 1.2rem;
      border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
      transition: var(--tb-transition);
    }
    .btn-submit:hover { transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-toggle {
      background: white; border: 1px solid var(--tb-border);
      padding: 4px 12px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
      transition: var(--tb-transition);
    }
    .btn-toggle:hover { background: var(--tb-light); border-color: var(--tb-primary); }

    .empty-msg { text-align: center; color: var(--tb-text-muted); padding: 2rem; font-size: 0.85rem; }

    .back-nav { text-align: center; margin-top: 2rem; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      background: white; color: var(--tb-dark);
      padding: 0.6rem 1.5rem; border-radius: 30px;
      text-decoration: none; font-weight: 600; border: 1px solid var(--tb-light);
      font-size: 0.85rem;
    }
    .btn-secondary:hover { background: var(--tb-light); }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--tb-dark); color: white;
      padding: 1rem 1.4rem; border-radius: 12px;
      font-size: 0.85rem; font-weight: 500;
      opacity: 0; transform: translateY(20px);
      transition: all 0.3s ease; z-index: 3000;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--tb-danger); }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-brand">🧱 Tembok Belajar — Siswa</div>
    <div class="app-user">
      <span id="userName">Memuat...</span>
      <div class="avatar" id="userAvatar">?</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <div id="loading" class="loading-box"><div class="spinner"></div><p>Memuat tugas...</p></div>

  <div class="page-container hidden" id="pageContent">
    <div class="page-toolbar">
      <h1>✏️ Tugas & Kuis
        <small>Kerjakan dan kumpulkan tugas Anda</small>
      </h1>
    </div>

    <div class="selector-row">
      <div>
        <label>Mata Pelajaran</label>
        <select id="selSubject" onchange="onSubjectChange()"></select>
      </div>
      <div>
        <label>Kelas</label>
        <select id="selClass" onchange="loadTasks()"></select>
      </div>
    </div>

    <div class="panel">
      <h2 class="panel-title">📋 Daftar Tugas</h2>
      <div class="task-list" id="taskList">
        <div class="empty-msg">Pilih mapel dan kelas</div>
      </div>
    </div>

    <div class="back-nav">
      <a href="dashboard.html" class="btn-secondary">← Kembali ke Dashboard</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    let currentUser = null;
    let allAssigns = [];
    let allTasks = [];

    (async () => {
      initSupabase();
      currentUser = await requireAuth('siswa');
      if (!currentUser) return;
      document.getElementById('userName').textContent = currentUser.name;
      document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();

      try {
        allAssigns = await getMyEnrolledSubjects(currentUser.id);
        const subjectsMap = {};
        allAssigns.forEach(a => { if (a.subjects) subjectsMap[a.subjects.id] = a.subjects; });
        const selSubject = document.getElementById('selSubject');
        selSubject.innerHTML = '<option value="">-- Pilih Mapel --</option>' +
          Object.values(subjectsMap).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
      } catch (err) { console.error(err); }

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('pageContent').classList.remove('hidden');
    })();

    function onSubjectChange() {
      const sid = parseInt(document.getElementById('selSubject').value);
      const selClass = document.getElementById('selClass');
      if (!sid) {
        selClass.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        return;
      }
      const classes = allAssigns.filter(a => a.subjects && a.subjects.id === sid)
        .map(a => a.classes).filter(Boolean)
        .filter((v, i, self) => self.findIndex(x => x.id === v.id) === i);
      selClass.innerHTML = '<option value="">-- Pilih Kelas --</option>' +
        classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
      if (classes.length === 1) { selClass.value = classes[0].id; loadTasks(); }
    }

    async function loadTasks() {
      const sid = parseInt(document.getElementById('selSubject').value);
      const cid = parseInt(document.getElementById('selClass').value);
      const list = document.getElementById('taskList');
      if (!sid || !cid) {
        list.innerHTML = '<div class="empty-msg">Pilih mapel dan kelas</div>';
        return;
      }
      list.innerHTML = '<div class="empty-msg">Memuat tugas...</div>';
      try {
        allTasks = await getMyActivities(currentUser.id, cid, sid);
        renderTasks();
      } catch (err) {
        list.innerHTML = '<div class="empty-msg" style="color:red;">Error: ' + err.message + '</div>';
      }
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      if (allTasks.length === 0) {
        list.innerHTML = '<div class="empty-msg">Belum ada tugas di kelas ini</div>';
        return;
      }

      const now = new Date();
      list.innerHTML = allTasks.map(t => {
        const deadline = t.deadline ? new Date(t.deadline) : null;
        const isPast = deadline && deadline < now;
        const hasSubmission = !!t.submission;
        const hasGrade = !!t.grade;

        let statusBadge = '';
        if (hasGrade) statusBadge = `<span class="badge badge-green">✅ Dinilai: ${t.grade.score}/${t.max_score}</span>`;
        else if (hasSubmission) statusBadge = `<span class="badge badge-blue">⏳ Menunggu penilaian</span>`;
        else if (isPast) statusBadge = `<span class="badge badge-red">❌ Terlambat</span>`;
        else statusBadge = `<span class="badge badge-yellow">📝 Belum dikerjakan</span>`;

        let submissionHtml = '';
        if (hasSubmission) {
          submissionHtml = `
            <div class="submission-box">
              <div class="label">📤 Jawaban Anda:</div>
              <div class="val">${t.submission.content ? esc(t.submission.content).replace(/\n/g, '<br>') : '<em style="color:#999;">(kosong)</em>'}</div>
              ${t.submission.file_url ? `<div class="val" style="margin-top:6px;">📎 <a href="${esc(t.submission.file_url)}" target="_blank">${esc(t.submission.file_url)}</a></div>` : ''}
              <div class="val" style="font-size:0.7rem; color:#999; margin-top:4px;">Dikumpul: ${new Date(t.submission.submitted_at).toLocaleString('id-ID')}</div>
              ${hasGrade && t.grade.feedback ? `<div class="val" style="margin-top:6px; padding:6px 10px; background:#fff3cd; border-radius:6px;">💬 Feedback guru: <em>${esc(t.grade.feedback)}</em></div>` : ''}
            </div>
          `;
        }

        const canSubmit = !hasGrade && !isPast;
        return `
          <div class="task-item">
            <div class="task-header">
              <div>
                <div class="task-title">${esc(t.title)} ${t.type === 'quiz' ? '🧪' : '📝'}</div>
                <div class="task-meta">
                  <span>⏰ ${deadline ? deadline.toLocaleString('id-ID') : '-'}</span>
                  <span>💯 Max: ${t.max_score}</span>
                </div>
              </div>
              <div>${statusBadge}</div>
            </div>
            <div class="task-desc">${esc(t.description || '(tanpa deskripsi)')}</div>
            ${submissionHtml}
            ${canSubmit ? `
              <button class="btn-toggle" onclick="toggleSubmitForm(${t.id})">📤 ${hasSubmission ? 'Ubah Jawaban' : 'Kumpulkan Tugas'}</button>
              <div class="submit-form" id="submitForm-${t.id}">
                <textarea id="content-${t.id}" placeholder="Tulis jawaban Anda...">${t.submission ? esc(t.submission.content || '') : ''}</textarea>
                <input type="text" id="fileUrl-${t.id}" placeholder="URL file/link (opsional, misal Google Drive)" value="${t.submission ? esc(t.submission.file_url || '') : ''}">
                <button class="btn-submit" id="btnSubmit-${t.id}" onclick="submitTask(${t.id})">📤 Kirim</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleSubmitForm(activityId) {
      const el = document.getElementById('submitForm-' + activityId);
      if (el) el.classList.toggle('active');
    }

    async function submitTask(activityId) {
      const content = document.getElementById('content-' + activityId).value.trim();
      const fileUrl = document.getElementById('fileUrl-' + activityId).value.trim();
      if (!content && !fileUrl) {
        alert('Isi minimal salah satu: jawaban teks atau URL file');
        return;
      }

      const btn = document.getElementById('btnSubmit-' + activityId);
      btn.disabled = true; btn.textContent = 'Mengirim...';

      try {
        await submitActivity({
          activityId, studentId: currentUser.id,
          content, fileUrl
        });
        showToast('✅ Tugas berhasil dikumpulkan');
        await loadTasks();
      } catch (err) {
        alert('Gagal: ' + err.message);
        btn.disabled = false; btn.textContent = '📤 Kirim';
      }
    }

    function esc(t) {
      if (t === null || t === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(t);
      return d.innerHTML;
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type === 'error' ? 'error' : '');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }
  </script>
</body>
</html>
