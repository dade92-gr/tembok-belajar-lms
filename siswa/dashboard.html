<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Siswa — Tembok Belajar</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="app-header">
    <div class="app-brand">🧱 Tembok Belajar — Siswa</div>
    <div class="app-user">
      <span id="schoolName" style="font-size:0.75rem; opacity:0.85; margin-right:8px;"></span>
      <span id="userName">Memuat...</span>
      <div class="avatar" id="userAvatar">?</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>

  <div id="loading" class="loading-box"><div class="spinner"></div><p>Memuat dashboard...</p></div>

  <div id="dashboard" class="dash-container hidden">
    <div class="dash-hero">
      <h1 id="greeting">Halo!</h1>
      <p class="muted" id="subGreeting"></p>
      <p class="muted" id="schoolInfo" style="margin-top:6px; font-size:0.85rem;"></p>
    </div>

    <div class="stat-grid" id="statsGrid"></div>

    <div class="dash-panel">
      <h2 class="panel-title">📌 Menu Cepat</h2>
      <div class="quick-menu" id="quickMenu"></div>
    </div>

    <div class="dash-panel">
      <h2 class="panel-title">ℹ️ Info</h2>
      <p class="muted">Pilih "Mapel Saya" untuk melihat mapel dan kelas yang Anda ikuti.</p>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    (async () => {
      initSupabase();
      const profile = await requireAuth('siswa');
      if (!profile) return;

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');

      document.getElementById('userName').textContent = profile.name;
      document.getElementById('userAvatar').textContent = profile.name.charAt(0).toUpperCase();
      document.getElementById('greeting').textContent = 'Halo, ' + profile.name + '!';
      document.getElementById('subGreeting').textContent = 'Siswa · ' + profile.email;

      try {
        const school = await getSchool(profile.school_id);
        if (school) {
          document.getElementById('schoolName').textContent = '🏫 ' + school.name;
          document.getElementById('schoolInfo').textContent =
            '🏫 ' + school.name + (school.academic_year ? ' · Tahun Ajaran ' + school.academic_year : '');
        }
      } catch (err) { console.warn('Sekolah:', err); }

      // Statistik
      let totalKelas = 0, totalMapel = 0, totalTugas = 0, totalNilai = 0;
      try {
        const enrolls = await getStudentClasses(profile.id);
        totalKelas = (enrolls || []).length;

        const enrolledSubs = await getMyEnrolledSubjects(profile.id);
        const subjectSet = new Set();
        enrolledSubs.forEach(a => { if (a.subject_id) subjectSet.add(a.subject_id); });
        totalMapel = subjectSet.size;

        const myGrades = await getMyGrades(profile.id);
        totalNilai = myGrades.length;

        // Hitung tugas aktif
        for (const a of enrolledSubs) {
          if (!a.subjects || !a.classes) continue;
          const acts = await getMyActivities(profile.id, a.classes.id, a.subjects.id);
          totalTugas += acts.filter(x => !x.submission).length;
        }
      } catch (err) { console.warn('Statistik:', err); }

      const stats = [
        { label: 'Kelas Diikuti', value: totalKelas },
        { label: 'Mapel', value: totalMapel },
        { label: 'Tugas Belum Dikerjakan', value: totalTugas },
        { label: 'Nilai Diterima', value: totalNilai }
      ];
      document.getElementById('statsGrid').innerHTML = stats.map(s => `
        <div class="stat-card">
          <div class="stat-value">${s.value}</div>
          <div class="stat-label">${s.label}</div>
        </div>
      `).join('');

      const menus = [
        { icon: '📚', label: 'Mapel Saya',       url: 'mapel.html' },
        { icon: '📄', label: 'Materi Belajar',   url: 'materi.html' },
        { icon: '✏️', label: 'Tugas & Kuis',     url: 'tugas.html' },
        { icon: '📊', label: 'Nilai Saya',       url: 'nilai.html' },
        { icon: '💬', label: 'Forum Diskusi',    url: 'forum.html' },
        { icon: '📈', label: 'Progress Belajar', url: 'progress.html' },
        { icon: '🔔', label: 'Notifikasi',       url: '#' }
      ];
      document.getElementById('quickMenu').innerHTML = menus.map(m => `
        <div class="quick-item" onclick="${m.url === '#'
          ? `alert('Fitur ${m.label} akan dibuat di fase berikutnya.')`
          : `window.location.href='${m.url}'`}">
          <span class="quick-icon">${m.icon}</span>
          <span>${m.label}</span>
        </div>
      `).join('');
    })();
  </script>
</body>
</html>
