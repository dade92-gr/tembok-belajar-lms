<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Siswa — Tembok Belajar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scrollbar-gutter: stable; }
    :root {
      --header-height: 68px; --sidebar-width: 72px; --sidebar-width-expanded: 240px;
      --header-bg: #1e293b; --header-bg-dark: #0f172a; --header-text: #ffffff; --header-text-muted: #94a3b8;
      --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --siswa-accent: #f59e0b;
      --bg: #f1f5f9; --bg-soft: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-secondary: #334155; --text-muted: #64748b; --border: #e2e8f0;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04); --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 10px 15px rgba(0,0,0,0.06);
      --radius: 12px; --radius-lg: 16px; --transition: all 0.2s ease;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; overflow: hidden; }

    /* HEADER */
    .app-header { background: var(--header-bg); padding: 0 1.5rem 0 calc(var(--sidebar-width) + 1rem); display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); transition: padding-left 0.25s ease; }
    body.sidebar-hover .app-header { padding-left: calc(var(--sidebar-width-expanded) + 1rem); }
    .app-brand { display: flex; align-items: center; gap: 12px; }
    .app-brand img { height: 44px; width: auto; }
    .app-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    .app-brand-title { font-size: 1.05rem; font-weight: 800; color: var(--header-text); }
    .app-brand-role { font-size: 0.65rem; font-weight: 600; color: #fcd34d; text-transform: uppercase; letter-spacing: 1px; }
    .app-user { display: flex; align-items: center; gap: 12px; }
    .app-school { display: flex; align-items: center; gap: 8px; padding: 0.4rem 0.9rem; background: rgba(255,255,255,0.1); border-radius: 999px; font-size: 0.75rem; font-weight: 600; color: #e2e8f0; }
    .app-user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; }
    .app-user-name { font-size: 0.82rem; font-weight: 600; color: var(--header-text); }
    .app-user-email { font-size: 0.68rem; color: var(--header-text-muted); }

    .btn-logout, .btn-switch-role {
      padding: 0.45rem 0.9rem; border-radius: 999px; cursor: pointer;
      font-size: 0.75rem; font-weight: 600; border: none; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
      transition: var(--transition);
    }
    .btn-logout { background: rgba(255,255,255,0.1); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.15); }
    .btn-logout:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
    .btn-switch-role { background: rgba(245,158,11,0.2); color: #fde68a; border: 1px solid rgba(245,158,11,0.4); display: none; }
    .btn-switch-role:hover { background: rgba(245,158,11,0.35); border-color: rgba(245,158,11,0.6); color: white; }

    /* SIDEBAR */
    .app-sidebar { position: fixed; top: var(--header-height); left: 0; bottom: 0; width: var(--sidebar-width); background: var(--header-bg-dark); display: flex; flex-direction: column; padding: 0.8rem 0; z-index: 110; overflow-y: auto; transition: width 0.25s ease; }
    .app-sidebar:hover { width: var(--sidebar-width-expanded); box-shadow: 4px 0 20px rgba(0,0,0,0.2); }
    .sidebar-item { position: relative; display: flex; align-items: center; gap: 14px; height: 44px; margin: 2px 10px; padding: 0 12px; border-radius: 8px; color: #94a3b8; font-size: 1rem; cursor: pointer; text-decoration: none; transition: background 0.15s, color 0.15s; }
    .sidebar-item:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    .sidebar-item.active { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .sidebar-item i { width: 22px; text-align: center; font-size: 1.05rem; }
    .sidebar-item .label { font-size: 0.85rem; font-weight: 600; opacity: 0; transition: opacity 0.15s; pointer-events: none; white-space: nowrap; }
    .app-sidebar:hover .sidebar-item .label { opacity: 1; }
    .sidebar-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 0.5rem 10px; }
    .sidebar-item.logout { margin-top: auto; }
    .sidebar-item.logout:hover { background: rgba(239,68,68,0.2); color: #fca5a5; }

    /* MAIN */
    .app-main { margin-top: var(--header-height); margin-left: var(--sidebar-width); height: calc(100vh - var(--header-height)); overflow-y: auto; background: var(--bg); position: relative; transition: margin-left 0.25s ease; }
    .content-frame { width: 100%; height: 100%; border: none; display: block; background: var(--bg); }
    .content-frame.hidden { display: none !important; visibility: hidden !important; }
    .content-home { padding: 1.5rem; max-width: 1280px; margin: 0 auto; }

    /* HERO & STATS */
    .dash-hero { background: var(--surface); border-radius: var(--radius-lg); padding: 1.8rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border); border-left: 4px solid var(--siswa-accent); }
    .dash-hero h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.35rem; }
    .dash-hero-sub { font-size: 0.9rem; color: var(--text-muted); }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--surface); border-radius: var(--radius); padding: 1.3rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; }
    .stat-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .stat-icon.blue { background: #dbeafe; color: #2563eb; } .stat-icon.purple { background: #f3e8ff; color: #9333ea; } .stat-icon.orange { background: #fed7aa; color: #ea580c; } .stat-icon.green { background: #d1fae5; color: #059669; }
    .stat-value { font-size: 1.75rem; font-weight: 800; line-height: 1.1; }
    .stat-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }

    /* PANEL */
    .dash-panel { background: var(--surface); border-radius: var(--radius-lg); margin-bottom: 1.5rem; border: 1px solid var(--border); overflow: hidden; }
    .panel-header { padding: 1.1rem 1.4rem; background: var(--bg-soft); border-bottom: 2px solid #fef3c7; }
    .panel-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .panel-title i { color: var(--siswa-accent); }
    .panel-body { padding: 1.4rem; }

    /* QUICK MENU */
    .quick-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0.9rem; }
    .quick-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 0.9rem; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 0.6rem; text-align: center; }
    .quick-item:hover { transform: translateY(-4px); border-color: var(--siswa-accent); box-shadow: 0 8px 20px rgba(245,158,11,0.15); }
    .quick-icon-wrap { width: 52px; height: 52px; background: var(--bg-soft); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: var(--siswa-accent); border: 1px solid var(--border); }
    .quick-label { font-size: 0.8rem; font-weight: 600; color: var(--text); }

    /* LOADING */
    .loading-box { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
    .spinner { width: 40px; height: 40px; margin: 0 auto 1rem; border: 3px solid #fef3c7; border-top-color: var(--siswa-accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .module-loading { position: absolute; inset: 0; background: rgba(241,245,249,0.95); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; z-index: 50; }
    .module-loading.active { display: flex; }
    .module-loading p { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

    @media (max-width: 768px) {
      :root { --header-height: 60px; --sidebar-width: 60px; --sidebar-width-expanded: 200px; }
      .app-brand-title { font-size: 0.95rem; }
      .app-school { display: none; }
      .app-user-email { display: none; }
      .btn-logout span { display: none; }
      .btn-switch-role span { display: none; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-brand">
      <img src="../assets/img/logo.png" alt="Tembok Belajar" onerror="this.style.display='none'">
      <div class="app-brand-text">
        <div class="app-brand-title">Tembok Belajar</div>
        <div class="app-brand-role">Panel Siswa</div>
      </div>
    </div>
    <div class="app-user">
      <div class="app-school" id="schoolBadge"><i class="fas fa-school"></i> <span id="schoolName">-</span></div>
      <div class="app-user-info">
        <div class="avatar" id="userAvatar">?</div>
        <div>
          <div class="app-user-name" id="userName">Memuat...</div>
          <div class="app-user-email" id="userEmail">-</div>
        </div>
      </div>
      <button class="btn-switch-role" id="btnSwitchRole" onclick="switchRole()">
        <i class="fas fa-users-gear"></i> <span>Ganti Peran</span>
      </button>
      <button class="btn-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> <span>Keluar</span></button>
    </div>
  </header>

  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-item active" data-view="home" onclick="navigateTo('home')"><i class="fas fa-home"></i><span class="label">Beranda</span></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-item" data-view="mapel" onclick="navigateTo('mapel')"><i class="fas fa-book"></i><span class="label">Mapel Saya</span></div>
    <div class="sidebar-item" data-view="unit" onclick="navigateTo('unit')"><i class="fas fa-layer-group"></i><span class="label">Unit Pembelajaran</span></div>
    <div class="sidebar-item" data-view="tugas" onclick="navigateTo('tugas')"><i class="fas fa-tasks"></i><span class="label">Tugas & Kuis</span></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-item" data-view="nilai" onclick="navigateTo('nilai')"><i class="fas fa-star"></i><span class="label">Nilai Saya</span></div>
    <div class="sidebar-item" data-view="progress" onclick="navigateTo('progress')"><i class="fas fa-chart-line"></i><span class="label">Progress & Jurnal</span></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-item" data-view="forum" onclick="navigateTo('forum')"><i class="fas fa-comments"></i><span class="label">Forum Diskusi</span></div>
    <div class="sidebar-item" data-view="profil" onclick="navigateTo('profil')"><i class="fas fa-user-cog"></i><span class="label">Profil</span></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-item logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i><span class="label">Keluar</span></div>
  </aside>

  <main class="app-main" id="appMain">
    <div class="module-loading" id="moduleLoading"><div class="spinner"></div><p>Memuat modul...</p></div>

    <div id="loading" class="loading-box"><div class="spinner"></div><p>Memuat dashboard...</p></div>

    <div id="contentHome" class="content-home hidden">
      <div class="dash-hero">
        <h1 id="greeting">Halo!</h1>
        <p class="dash-hero-sub" id="subGreeting"></p>
      </div>
      <div class="stat-grid" id="statsGrid"></div>
      <div class="dash-panel">
        <div class="panel-header"><div class="panel-title"><i class="fas fa-bolt"></i> Menu Cepat</div></div>
        <div class="panel-body"><div class="quick-menu" id="quickMenu"></div></div>
      </div>
    </div>

    <iframe id="contentFrame" class="content-frame hidden" src="about:blank"></iframe>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    const VIEW_URLS = {
      mapel: 'mapel.html?embed=1',
      unit: 'mapel.html?embed=1',  // halaman unit juga pakai mapel.html
      tugas: 'tugas.html?embed=1',
      nilai: 'nilai.html?embed=1',
      progress: 'progress.html?embed=1',
      forum: 'forum.html?embed=1',
      profil: 'profil.html?embed=1'
    };

    const sidebar = document.getElementById('appSidebar');
    sidebar.addEventListener('mouseenter', () => document.body.classList.add('sidebar-hover'));
    sidebar.addEventListener('mouseleave', () => document.body.classList.remove('sidebar-hover'));

    // ============================================
    // STATE NAVIGASI
    // ============================================
    let _navTimeout = null;
    let _currentFrameSrc = '';
    let _isHomeView = true;
    let _initDone = false;

    // ============================================
    // INIT
    // ============================================
    (async () => {
      initSupabase();
      const profile = await requireAuth('siswa');
      if (!profile) return;

      window.currentUser = profile;

      // ✅ Tampilkan tombol Ganti Peran kalau >1 role
      if (profile.roles && profile.roles.length > 1) {
        document.getElementById('btnSwitchRole').style.display = 'inline-flex';
      }

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('contentHome').classList.remove('hidden');

      document.getElementById('userName').textContent = profile.name;
      document.getElementById('userEmail').textContent = profile.email;
      document.getElementById('userAvatar').textContent = (profile.name || '?').charAt(0).toUpperCase();
      document.getElementById('greeting').textContent = 'Halo, ' + profile.name + '! 👋';
      document.getElementById('subGreeting').textContent = 'Selamat datang kembali di panel siswa Tembok Belajar.';

      // Tampilkan nama sekolah kalau ada
      try {
        if (profile.school_id && typeof getSchool === 'function') {
          const school = await getSchool(profile.school_id);
          if (school) document.getElementById('schoolName').textContent = school.name;
        }
      } catch (e) { /* ignore */ }

      // Quick menu
      const menus = [
        { icon: 'fa-book', label: 'Mapel Saya', view: 'mapel' },
        { icon: 'fa-layer-group', label: 'Unit Pembelajaran', view: 'unit' },
        { icon: 'fa-tasks', label: 'Tugas & Kuis', view: 'tugas' },
        { icon: 'fa-star', label: 'Nilai Saya', view: 'nilai' },
        { icon: 'fa-chart-line', label: 'Progress & Jurnal', view: 'progress' },
        { icon: 'fa-comments', label: 'Forum Diskusi', view: 'forum' }
      ];
      document.getElementById('quickMenu').innerHTML = menus.map(m => `
        <div class="quick-item" onclick="navigateTo('${m.view}')">
          <div class="quick-icon-wrap"><i class="fas ${m.icon}"></i></div>
          <div class="quick-label">${m.label}</div>
        </div>
      `).join('');

      // Statistik placeholder
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-door-open"></i></div><div><div class="stat-value">-</div><div class="stat-label">Kelas</div></div></div>
        <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-book"></i></div><div><div class="stat-value">-</div><div class="stat-label">Mapel</div></div></div>
        <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-tasks"></i></div><div><div class="stat-value">-</div><div class="stat-label">Tugas</div></div></div>
      `;

      // === MARK INIT SELESAI ===
      _initDone = true;

      // === HANDLE HASH SETELAH INIT SELESAI ===
      const initialHash = window.location.hash.substring(1);
      if (initialHash && VIEW_URLS[initialHash]) {
        navigateTo(initialHash);
      } else {
        resetFrameToBlank();
        syncSidebarActive('home');
      }
    })();

    // ============================================
    // HELPER — reset iframe total
    // ============================================
    function resetFrameToBlank() {
      const frameEl = document.getElementById('contentFrame');
      if (!frameEl) return;

      frameEl.onload = null;
      frameEl.classList.add('hidden');
      frameEl.src = 'about:blank';
      frameEl.style.height = '0';
      frameEl.style.display = 'none';

      _currentFrameSrc = '';
      _isHomeView = true;

      const appMain = document.getElementById('appMain');
      if (appMain) appMain.scrollTop = 0;
    }

    // ============================================
    // HELPER — sinkronkan sidebar active
    // ============================================
    function syncSidebarActive(view) {
      document.querySelectorAll('.sidebar-item[data-view]').forEach(el => {
        el.classList.toggle('active', el.dataset.view === view);
      });
    }

    // ============================================
    // NAVIGASI
    // ============================================
    function navigateTo(view) {
      if (!_initDone) {
        if (history.replaceState) history.replaceState({ view }, '', '#' + view);
        else window.location.hash = view;
        return;
      }

      if (_navTimeout) { clearTimeout(_navTimeout); _navTimeout = null; }

      syncSidebarActive(view);

      const homeEl = document.getElementById('contentHome');
      const frameEl = document.getElementById('contentFrame');
      const loadingEl = document.getElementById('moduleLoading');
      const appMain = document.getElementById('appMain');

      appMain.scrollTop = 0;

      // === HOME ===
      if (view === 'home') {
        resetFrameToBlank();
        loadingEl.classList.remove('active');
        homeEl.classList.remove('hidden');

        if (history.pushState) history.pushState({ view }, '', '#' + view);
        else window.location.hash = view;
        return;
      }

      // === MODUL ===
      const url = VIEW_URLS[view];
      if (!url) { alert('Modul tidak dikenal: ' + view); return; }

      // Skip reload kalau URL sama
      if (_currentFrameSrc === url && !_isHomeView) {
        frameEl.classList.remove('hidden');
        frameEl.style.display = 'block';
        frameEl.style.height = '';
        loadingEl.classList.remove('active');
        if (history.pushState) history.pushState({ view }, '', '#' + view);
        else window.location.hash = view;
        return;
      }

      homeEl.classList.add('hidden');
      loadingEl.classList.add('active');

      frameEl.classList.add('hidden');
      frameEl.style.display = 'none';
      frameEl.style.height = '0';

      frameEl.onload = null;
      frameEl.src = url;
      _currentFrameSrc = url;
      _isHomeView = false;

      const thisNavSrc = url;
      frameEl.onload = function onFrameLoad() {
        if (frameEl.src.indexOf(thisNavSrc) === -1 || _currentFrameSrc !== thisNavSrc) return;
        if (_isHomeView) return;

        loadingEl.classList.remove('active');
        frameEl.classList.remove('hidden');
        frameEl.style.display = 'block';
        frameEl.style.height = '';
      };

      _navTimeout = setTimeout(() => {
        if (frameEl.src.indexOf(thisNavSrc) === -1 || _currentFrameSrc !== thisNavSrc) return;
        if (_isHomeView) return;
        loadingEl.classList.remove('active');
        frameEl.classList.remove('hidden');
        frameEl.style.display = 'block';
        frameEl.style.height = '';
      }, 5000);

      if (history.pushState) history.pushState({ view }, '', '#' + view);
      else window.location.hash = view;
    }

    // ============================================
    // LOAD UNIT DETAIL (dari pesan iframe)
    // ============================================
    function loadUnitDetail(unitId) {
      if (!unitId) return;
      if (_navTimeout) { clearTimeout(_navTimeout); _navTimeout = null; }

      const frameEl = document.getElementById('contentFrame');
      const loadingEl = document.getElementById('moduleLoading');
      const homeEl = document.getElementById('contentHome');

      // Sinkronkan sidebar (anggap "unit" masih aktif)
      syncSidebarActive('unit');

      homeEl.classList.add('hidden');
      loadingEl.classList.add('active');

      frameEl.classList.add('hidden');
      frameEl.style.display = 'none';
      frameEl.style.height = '0';

      frameEl.onload = null;
      const url = `unit-detail.html?unit_id=${unitId}&embed=1`;
      frameEl.src = url;
      _currentFrameSrc = url;
      _isHomeView = false;

      const thisNavSrc = url;
      frameEl.onload = function onFrameLoad() {
        if (frameEl.src.indexOf(thisNavSrc) === -1 || _currentFrameSrc !== thisNavSrc) return;
        if (_isHomeView) return;

        loadingEl.classList.remove('active');
        frameEl.classList.remove('hidden');
        frameEl.style.display = 'block';
        frameEl.style.height = '';
      };

      _navTimeout = setTimeout(() => {
        if (frameEl.src.indexOf(thisNavSrc) === -1 || _currentFrameSrc !== thisNavSrc) return;
        if (_isHomeView) return;
        loadingEl.classList.remove('active');
        frameEl.classList.remove('hidden');
        frameEl.style.display = 'block';
        frameEl.style.height = '';
      }, 5000);

      if (history.pushState) {
        history.pushState({ view: 'unit-detail', unitId }, '', '#unit-detail/' + unitId);
      }
    }

    // ============================================
    // LISTENER PESAN DARI IFRAME
    // ============================================
    window.addEventListener('message', (e) => {
      if (!e.data || typeof e.data !== 'object') return;

      if (e.data.type === 'SISWA_OPEN_UNIT_DETAIL' && e.data.unitId) {
        loadUnitDetail(e.data.unitId);
        return;
      }

      if (e.data.type === 'SISWA_NAVIGATE' && e.data.view) {
        if (e.data.context) sessionStorage.setItem('siswa_context', JSON.stringify(e.data.context));
        navigateTo(e.data.view);
        return;
      }
    });

    // ============================================
    // POPSTATE & PAGESHOW
    // ============================================
    window.addEventListener('popstate', (e) => {
      const state = e.state || {};
      const hash = window.location.hash.substring(1);

      if (state.view === 'unit-detail' && state.unitId) {
        loadUnitDetail(state.unitId);
        return;
      }
      if (hash.startsWith('unit-detail/')) {
        loadUnitDetail(hash.substring('unit-detail/'.length));
        return;
      }

      const view = state.view || hash || 'home';
      navigateTo(view);
    });

    window.addEventListener('pageshow', (e) => {
      if (e.persisted && _initDone) {
        const hash = window.location.hash.substring(1);
        navigateTo(hash || 'home');
      }
    });

    // ============================================
    // DOM READY — kalau tanpa hash, reset iframe
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.substring(1);
      if (!hash || !VIEW_URLS[hash]) {
        resetFrameToBlank();
      }
    });
  </script>
</body>
</html>
